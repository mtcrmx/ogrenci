            }
            if (activeTeam && activeTeam !== team && p.state !== 'CHASE') {
                return !isInOwnHalf(team, p.y);
            }
            return false;
        }).length;
        const gkText = gk ? `${Math.round(gk.x)},${Math.round(gk.y)}` : 'yok';
        lines.push(`${team.name}: GK ${gkText} | D/M/F ${def}/${mid}/${fwd} | sekilUyari ${outOfShape}`);
    });
    lines.push(`top ${Math.round(ball.x)},${Math.round(ball.y)} hiz ${ball.speed.toFixed(1)} | ${stateMachine}`);
    debugPanel.textContent = lines.join("\\n");
}

// AI Update Loop
function update() {
    if (!isPlaying) return;
    if (stateMachine === "GOAL_CELEBRATION") return;
    if (stateMachine === "HALFTIME") {
        // Halftime countdown handled by setInterval, not gameLoop
        return;
    }
    timeTicks++;
    
    const gameMin = Math.floor((timeTicks / TOTAL_TICKS) * 90);
    const gameSec = Math.floor(((timeTicks / TOTAL_TICKS) * 90 * 60) % 60);
    document.getElementById('timer').textContent = `${gameMin.toString().padStart(2,'0')}:${gameSec.toString().padStart(2,'0')}`;
    if (timeTicks % 15 === 0) updateBroadcastHud();
    
    // Halftime check at 45 min (halfway)
    if (!isSecondHalf && timeTicks >= TOTAL_TICKS / 2) {
        startHalftime();
        return;
    }
    
    if (timeTicks >= TOTAL_TICKS) {
        isPlaying = false; showEvent("Maç Sona Erdi!", 5000);
        stopStadium();
        document.getElementById('close-btn').style.display = 'block';
        
        // Auto-submit result
        if (window.opener && !window.opener.closed) {
            try {
                const spor = new URLSearchParams(window.location.search).get("spor") || "futbol";
                const doc = window.opener.document;
                const in1 = doc.getElementById("skor1-" + spor);
                const in2 = doc.getElementById("skor2-" + spor);
                if (in1 && in2) {
                    in1.value = score1;
                    in2.value = score2;
                    const form = in1.closest('form');
                    if (form) {
                        form.submit();
                        setTimeout(() => showEvent("Sonuç öğretmene başarıyla gönderildi!", 5000), 1000);
                    }
                }
            } catch (e) {
                console.error("Auto submit failed", e);
            }
        }
        return;
    }

    // Set Piece State
    if (stateMachine === "SET_PIECE") {
        // Realistic player repositioning (Football Manager Style)
        const atkGoalY = setPieceTeam.goalY; // goal the attacking team targets
        const defGoalY = setPieceTeam.goalY; // defending team's goal line is the target goal
        const atkDir = setPieceTeam.dirY; // -1 or 1
        
        let atkCount = 0;
        let defCount = 0;
        
        players.forEach(p => {
            if (p === ball.owner) return; // taker stays at ball
            
            const isGK = isGoalkeeper(p);
            const isDefensiveRole = isDefender(p);
            const rol = roleText(p);
            const isForwardRole = rol.includes("forvet") || rol.includes("kanat") || rol.includes("hücum") || rol.includes("hucum");
            let targetX = p.baseX;
            let targetY = p.baseY;
            
            if (setPieceType === "PENALTI") {
                if (isGK && p.team !== setPieceTeam) {
                    targetX = GAME_WIDTH / 2; targetY = defGoalY === 0 ? 5 : GAME_HEIGHT - 5;
                } else if (isGK && p.team === setPieceTeam) {
                    targetX = GAME_WIDTH / 2; targetY = p.team.defendY === 0 ? 80 : GAME_HEIGHT - 80;
                } else {
                    // Everyone else stands exactly outside the penalty box and arc.
                    const penSpotY = atkGoalY === 0 ? 110 : GAME_HEIGHT - 110;
                    const isDef = p.team !== setPieceTeam;
                    if (isDef) defCount++; else atkCount++;
                    
                    const lineY = atkGoalY === 0 ? 135 : GAME_HEIGHT - 135;
                    const idx = isDef ? defCount : atkCount;
                    const offset = isDef ? (idx * 25) : (idx * 25 + 10);
                    targetX = GAME_WIDTH / 2 + (idx % 2 === 0 ? offset : -offset);
                    targetY = lineY + (atkDir * -20); 
                    
                    if (dist({x: targetX, y: targetY}, {x: GAME_WIDTH/2, y: penSpotY}) < 65) {
                        targetY += (atkDir * -30); // push back out of arc
                    }
                }
            } else if (setPieceType === "FRİKİK") {
                const isDef = p.team !== setPieceTeam;
                if (isDef) defCount++; else atkCount++;
                const dirToGoal = normalize(GAME_WIDTH/2 - ball.x, defGoalY - ball.y);
                const ballInDefendingHalf = isInOwnHalf(p.team, ball.y);
                
                if (isGK && isDef) {
                    const goalCenterX = GAME_WIDTH/2;
                    targetX = goalCenterX + (ball.x - goalCenterX) * 0.25;
                    targetY = defGoalY === 0 ? 18 : GAME_HEIGHT - 18;
                } else if (isDef) {
                    const distToGoal = dist(ball, {x: GAME_WIDTH/2, y: defGoalY});
                    const needsWall = ballInDefendingHalf && distToGoal < 300;
                    const wallSize = needsWall ? Math.max(2, Math.min(5, Math.floor((350 - distToGoal)/40))) : 0;
                    
                    if (defCount <= wallSize) {
                        const perpX = -dirToGoal.y; const perpY = dirToGoal.x;
                        const wallCenterX = ball.x + dirToGoal.x * 80;
                        const wallCenterY = ball.y + dirToGoal.y * 80;
                        const offset = (defCount - (wallSize+1)/2) * 16;
                        targetX = wallCenterX + perpX * offset;
                        targetY = wallCenterY + perpY * offset;
                    } else {
                        // Faulde savunan takım kendi yarı sahasında bekler ve kaleyi kapatan hat kurar.
                        const half = ownHalfBounds(p.team, 42);
                        const depth = isDefensiveRole ? 115 : (isForwardRole ? 285 : 205);
                        const lineFromGoal = p.team.defendY === 0
                            ? Math.min(half.maxY, p.team.defendY + depth)
                            : Math.max(half.minY, p.team.defendY - depth);
                        const sideSpread = (defCount % 2 === 0 ? 1 : -1) * (38 + (defCount % 4) * 22);
                        targetX = GAME_WIDTH / 2 + sideSpread;
                        targetY = lineFromGoal;
                    }
                } else {
                    if (atkCount === 1) { // Short option
                        targetX = ball.x + (ball.x < GAME_WIDTH/2 ? 40 : -40);
                        targetY = ball.y + atkDir * 20;
                    } else if (atkCount <= 5 && !isDefensiveRole) { // Runs into box
                        targetX = GAME_WIDTH/2 + (atkCount % 2 === 0 ? 1 : -1) * (10 + atkCount*15);
                        targetY = defGoalY === 0 ? 100 + atkCount*10 : GAME_HEIGHT - (100 + atkCount*10);
                    } else { // Stay back
                        targetX = p.baseX;
                        targetY = Math.max(120, Math.min(GAME_HEIGHT - 120, p.baseY + p.team.dirY * 45));
                    }
                }
            } else if (setPieceType === "KORNER") {
                const isLeftCorner = ball.x < GAME_WIDTH/2;
                const isDef = p.team !== setPieceTeam;
                if (isDef) defCount++; else atkCount++;
                const goalDir = defGoalY === 0 ? 1 : -1;
                const infieldDir = isLeftCorner ? 1 : -1;
                
                if (isGK && isDef) {
                    targetX = GAME_WIDTH/2 + (isLeftCorner ? -18 : 18);
                    targetY = goalDepthY(defGoalY, 18);
                } else if (isDef) {
                    if (defCount <= 5) {
                        targetX = mirroredSlotX(defCount, 18);
                        targetY = goalDepthY(defGoalY, 58 + (defCount % 3) * 22);
                    } else if (defCount <= 8) {
                        targetX = mirroredSlotX(defCount - 5, 46);
                        targetY = goalDepthY(defGoalY, 150);
                    } else {
                        targetX = GAME_WIDTH/2 + (defCount % 2 === 0 ? 95 : -95);
                        targetY = goalDepthY(defGoalY, 245);
                    }
                } else {
                    if (isGK) {
                        targetX = GAME_WIDTH / 2;
                        targetY = p.team.defendY === 0 ? 58 : GAME_HEIGHT - 58;
                    } else if (atkCount === 1) {
                        targetX = ball.x + infieldDir * 62;
                        targetY = ball.y + goalDir * 42;
                    } else if (!isDefensiveRole && atkCount <= 6) {
                        targetX = mirroredSlotX(atkCount - 1, 16);
                        targetY = goalDepthY(defGoalY, 60 + ((atkCount - 2) % 4) * 28);
                    } else if (!isDefensiveRole && atkCount <= 8) {
                        targetX = mirroredSlotX(atkCount - 6, 68);
                        targetY = goalDepthY(defGoalY, 178);
                    } else {
                        targetX = GAME_WIDTH / 2 + (atkCount % 2 === 0 ? 112 : -112);
                        targetY = goalDepthY(defGoalY, isDefensiveRole ? 300 : 230);
                    }
                }
            } else if (setPieceType === "TAC") {
                const isDef = p.team !== setPieceTeam;
                if (isDef) defCount++; else atkCount++;
                
                const sidelineDir = ball.x < GAME_WIDTH/2 ? 1 : -1;
                const throwY = clampValue(ball.y, 58, GAME_HEIGHT - 58);
                
                if (isDef) {
                    if (isGK) {
                        targetX = GAME_WIDTH / 2;
                        targetY = p.team.defendY === 0 ? 38 : GAME_HEIGHT - 38;
                    } else if (defCount <= 4) {
                        targetX = ball.x + sidelineDir * (54 + defCount * 12);
                        targetY = throwY + [-44, -12, 22, 58][defCount - 1];
                    } else {
                        const blockDepth = isDefensiveRole ? -22 : (isMidfielder(p) ? 42 : 104);
                        targetX = GAME_WIDTH / 2 + sidelineDir * (defCount % 2 === 0 ? 62 : 106);
                        targetY = throwY + setPieceTeam.dirY * blockDepth;
                    }
                } else {
                    if (isGK) {
                        targetX = GAME_WIDTH / 2;
                        targetY = p.team.defendY === 0 ? 62 : GAME_HEIGHT - 62;
                    } else if (atkCount === 1) {
                        targetX = ball.x + sidelineDir * 52;
                        targetY = throwY + atkDir * 34;
                    } else if (atkCount === 2) {
                        targetX = ball.x + sidelineDir * 55;
                        targetY = throwY - atkDir * 42;
                    } else if (atkCount === 3) {
                        targetX = ball.x + sidelineDir * 24;
                        targetY = throwY + atkDir * 112;
                    } else if (atkCount <= 6 && !isDefensiveRole) {
                        targetX = GAME_WIDTH / 2 + sidelineDir * (atkCount % 2 === 0 ? 48 : 92);
                        targetY = throwY + atkDir * (28 + atkCount * 12);
                    } else {
                        targetX = GAME_WIDTH / 2 + sidelineDir * (atkCount % 2 === 0 ? 118 : 150);
                        targetY = throwY - atkDir * (isDefensiveRole ? 92 : 35);
                    }
                }
            } else if (setPieceType === "AUT") {
                if (isGK && p.team === setPieceTeam) {
                    targetX = GAME_WIDTH/2; targetY = p.team.defendY === 0 ? 60 : GAME_HEIGHT - 60;
                } else if (p.team === setPieceTeam) {
                    targetX = p.baseX; targetY = p.baseY + p.team.dirY * -100; // Drop deep to receive
                } else {
                    targetX = p.baseX; targetY = p.baseY + p.team.dirY * 100; // Push up to press
                }
            }
            
            targetX = Math.max(15, Math.min(GAME_WIDTH-15, targetX));
            targetY = Math.max(15, Math.min(GAME_HEIGHT-15, targetY));
            if ((setPieceType === "FRİKİK" || setPieceType === "PENALTI") && p.team !== setPieceTeam) {
                const safePos = clampToOwnHalf(p.team, targetX, targetY, isGK ? 12 : 30);
                targetX = safePos.x;
                targetY = isGK ? (p.team.defendY === 0 ? 18 : GAME_HEIGHT - 18) : safePos.y;
            }
            
            moveTowardPoint(p, targetX, targetY, 3.2);
        });
        separatePlayers();

        setPieceTimer--;
        if (setPieceTimer <= 0) {
            // Take the set piece
            if (ball.owner) {
                const p = ball.owner;
                
                const goalDistance = dist(p, {x: GAME_WIDTH/2, y: p.team.goalY});
                const directShot = setPieceType === "PENALTI" || (setPieceType === "FRİKİK" && goalDistance < 270);
                if (directShot) {
                    // Shoot directly at goal
                    const errMargin = (100 - p.ozellikler.sut) / 100;
                    const gX = GAME_WIDTH/2 + (Math.random() * 80 - 40);
                    const errX = (Math.random() * 200 - 100) * errMargin;
                    const dir = normalize((gX + errX) - p.x, p.team.goalY - p.y);
                    const power = setPieceType === "PENALTI" ? 22 : 18 + (p.ozellikler.sut / 12);
                    ball.vx = dir.x * power; ball.vy = dir.y * power;
                } else {
                    // find a realistic receiver for throw-in, corner or indirect free kick
                    let bestMate = chooseSetPieceReceiver(p);
                    
                    if (bestMate) {
                        const errMargin = (100 - p.ozellikler.pas) / 100;
                        const errScale = setPieceType === "KORNER" ? 54 : (setPieceType === "TAC" ? 24 : 42);
                        const lead = setPieceType === "TAC" ? 2 : 6;
                        const errX = (Math.random() * errScale - errScale / 2) * errMargin;
                        const errY = (Math.random() * errScale - errScale / 2) * errMargin;
                        const aimX = bestMate.x + (bestMate.vx || 0) * lead + errX;
                        const aimY = bestMate.y + (bestMate.vy || 0) * lead + errY;
                        const dir = normalize(aimX - p.x, aimY - p.y);
                        const basePower = setPieceType === "KORNER" ? 18.5 : (setPieceType === "TAC" ? 9.5 : 12);
                        const power = basePower + (p.ozellikler.pas / (setPieceType === "KORNER" ? 22 : 24)) + (Math.random()*3-1.5)*errMargin;
                        ball.vx = dir.x * power; ball.vy = dir.y * power;
                        ball.vz = setPieceType === "KORNER" ? 6 + Math.random() * 2.2 : (setPieceType === "TAC" ? 1.2 + Math.random() * 0.9 : 3);
                        ball.targetPlayer = bestMate;
                        if (setPieceType === "KORNER") showEvent("Korner ortası!", 900);
                        if (setPieceType === "TAC") showEvent("Taç kullanıldı!", 700);
                    } else {
                        ball.vx = (GAME_WIDTH/2 - p.x) * 0.05; ball.vy = (p.team.goalY - p.y) * 0.05;
                    }
                }
                
                playKickSound(true);
                ball.lastTouchedBy = p;
                ball.owner = null;
                p.actionCooldown = 30;
            }
            stateMachine = "PLAYING";
            if (setPieceType !== "KORNER" && setPieceType !== "TAC") {
                showEvent("Oyun devam ediyor!", 1000);
            }
        }
        updateDebugPanel();
        return;
    }

    // === ADVANCED BALL PHYSICS ===
    // Gravity
    ball.vz -= 0.15;
    ball.z += ball.vz;
    
    // Bounce off ground
    if (ball.z <= 0) {
        ball.z = 0;
        if (ball.vz < -1) {
            ball.vz = -ball.vz * BOUNCE_RESTITUTION; // bounce with energy loss
            ball.vx *= 0.9; ball.vy *= 0.9; // horizontal energy loss on bounce
        } else {
            ball.vz = 0; // settle on ground
        }
    }
    
    // Ground friction (only when on ground)
    if (ball.z <= 0.5) {
        ball.vx *= GRASS_FRICTION;
        ball.vy *= GRASS_FRICTION;
    }
    
    // Air drag (when airborne, proportional to speed²)
    if (ball.z > 0.5) {
        const spd = Math.hypot(ball.vx, ball.vy);
        if (spd > 0.5) {
            const drag = AIR_DRAG * spd * spd;
            const ratio = Math.max(0, 1 - drag / spd);
            ball.vx *= ratio;
            ball.vy *= ratio;
        }
    }
    
    // Magnus Effect (spin curves ball)
    if (ball.z > 0 && (Math.abs(ball.spinX) > 0.01 || Math.abs(ball.spinY) > 0.01)) {
        ball.vx += ball.spinX * MAGNUS_COEFF;
        ball.vy += ball.spinY * MAGNUS_COEFF;
        ball.spinX *= 0.97; ball.spinY *= 0.97; // spin decay
    }
    
    // Apply velocity
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.speed = Math.hypot(ball.vx, ball.vy);

    // --- Takılma önleme: sahipsiz top + eski pas hedefi → kimse koşmuyor ---
    if (!ball.owner) {
        if (ball.targetPlayer) {
            const tp = ball.targetPlayer;
            if (!players.includes(tp)) {
                ball.targetPlayer = null;
            } else if (ball.speed < 0.55 && dist(ball, tp) > 72) {
                ball.targetPlayer = null;
            }
        }
        if (ball.speed < 0.22) ball.stallTicks++;
        else ball.stallTicks = 0;
        if (ball.stallTicks > 35) {
            ball.targetPlayer = null;
            if (ball.stallTicks > 110) {
                ball.vx += (Math.random() - 0.5) * 1.1;
                ball.vy += (Math.random() - 0.5) * 1.1;
                ball.stallTicks = 45;
            }
        }
    } else {
        ball.stallTicks = 0;
    }
    
    // Goal Check: Ball must beat the goalkeeper
    const goalLeft = GAME_WIDTH/2 - 75, goalRight = GAME_WIDTH/2 + 75;
    function tryGoal(scoringTeam, defendingTeam, scoreEl, goalY) {
        // Find GK of defending team
        const gk = players.find(p => p.team === defendingTeam && isGoalkeeper(p));
        if (gk) {
            const shooter = ball.lastTouchedBy;
            const reactionDistance = dist(gk, ball);
            const anglePenalty = Math.abs(ball.x - GAME_WIDTH / 2) / 22;
            const shotPower = (shooter ? shooter.ozellikler.sut : 50)
                + ball.speed * 4.1
                + Math.max(0, ball.z) * 1.35
                + (shooter?.brain?.composure || 58) * 0.18
                + Math.random() * 22;
            const closeReaction = reactionDistance < 24 ? 11 : (reactionDistance < 46 ? 3 : -7);
            const savePower = gk.ozellikler.kaleci
                + (gk.brain?.composure || 55) * 0.12
                + Math.random() * 20
                + closeReaction
                - anglePenalty;
            if (savePower > shotPower + 8) {
                // SAVE!
                showEvent(`${gk.ad} KURTARDI! 🧤`, 2000);
                // GK pushes ball away
                const pushDir = normalize(ball.x - GAME_WIDTH/2, ball.y - defendingTeam.defendY);
                ball.vx = pushDir.x * 10 + (Math.random()-0.5)*6;
                ball.vy = pushDir.y * 10;
                ball.owner = null;
                ball.lastTouchedBy = gk;
                playKickSound(true);
                return false;
            }
        }
        return true;
    }
    
    function scoringTeamAtY(goalLineY) {
        return team1.goalY === goalLineY ? team1 : team2;
    }
    function defendingTeamAtY(goalLineY) {
        return team1.defendY === goalLineY ? team1 : team2;
    }
    if (ball.y <= 10 && ball.x > goalLeft && ball.x < goalRight) {
        const scoringTeam = scoringTeamAtY(0);
        const defendingTeam = defendingTeamAtY(0);
        if (tryGoal(scoringTeam, defendingTeam, 'score', 0)) {
            if (scoringTeam === team1) {
                score1++; document.getElementById('score1').textContent = score1;
            } else {
                score2++; document.getElementById('score2').textContent = score2;
            }
            playGoalSound();
            showEvent(`⚽ GOOOL! ${scoringTeam.name} yazdı!`, 4000);
            stateMachine = "GOAL_CELEBRATION";
            setTimeout(resetPositions, 4000);
        }
        return;
    }
    if (ball.y >= GAME_HEIGHT-10 && ball.x > goalLeft && ball.x < goalRight) {
        const scoringTeam = scoringTeamAtY(GAME_HEIGHT);
        const defendingTeam = defendingTeamAtY(GAME_HEIGHT);
        if (tryGoal(scoringTeam, defendingTeam, 'score', GAME_HEIGHT)) {
            if (scoringTeam === team1) {
                score1++; document.getElementById('score1').textContent = score1;
            } else {
                score2++; document.getElementById('score2').textContent = score2;
            }
            playGoalSound();
            showEvent(`⚽ GOOOL! ${scoringTeam.name} yazdı!`, 4000);
            stateMachine = "GOAL_CELEBRATION";
            setTimeout(resetPositions, 4000);
        }
        return;
    }

    // Out of bounds logic
    let isOut = false;
    if (ball.x < 0 || ball.x > GAME_WIDTH) {
        isOut = true;
        setPieceType = "TAC";
        ball.x = Math.max(2, Math.min(GAME_WIDTH-2, ball.x));
    } else if (ball.y < 0 || ball.y > GAME_HEIGHT) {
        isOut = true;
        const defendingTeam = ball.y < 0 ? team2 : team1;
        if (ball.lastTouchedBy && ball.lastTouchedBy.team === defendingTeam) {
            setPieceType = "KORNER";
            ball.x = ball.x < GAME_WIDTH/2 ? 5 : GAME_WIDTH-5;
            ball.y = ball.y < 0 ? 5 : GAME_HEIGHT-5;
        } else {
            setPieceType = "AUT";
            ball.x = GAME_WIDTH/2;
            ball.y = ball.y < 0 ? 60 : GAME_HEIGHT-60;
        }
    }

    if (isOut) {
        stateMachine = "SET_PIECE";
        setPieceTimer = 90; // 1.5 seconds wait
        setPieceTeam = ball.lastTouchedBy && ball.lastTouchedBy.team === team1 ? team2 : team1;
        
        // Pick a player to take it
        let taker = null;
        if (setPieceType === "AUT") {
            taker = players.find(p => p.team === setPieceTeam && isGoalkeeper(p))
                || players.find(p => p.team === setPieceTeam && isDefender(p));
        }
        if (!taker) {
            let closest = null; let d = 9999;
            players.forEach(p => {
                if (p.team === setPieceTeam && !isGoalkeeper(p) && dist(p, ball) < d) {
                    d = dist(p, ball);
                    closest = p;
                }
            });
            taker = closest;
        }
        
        ball.vx = 0; ball.vy = 0;
        ball.owner = taker;
        if (taker) {
            taker.x = ball.x; taker.y = ball.y;
        }
        
        showEvent(setPieceTeam.name + " " + setPieceType + " kullanacak", 2000);
        return;
    }

    // === POSSESSION & PHYSICS-BASED TACKLING ===
    if (ball.owner) {
        ball.owner.hasBallTime++;
        // Dribbling: ball follows player with slight impulse lag
        const dribLag = 0.85;
        ball.x = ball.x * (1-dribLag) + ball.owner.x * dribLag;
        ball.y = ball.y * (1-dribLag) + ball.owner.y * dribLag;
        ball.z = 0; ball.vx = 0; ball.vy = 0; ball.vz = 0;
        ball.spinX = 0; ball.spinY = 0;
        ball.targetPlayer = null;
        ball.lastTouchedBy = ball.owner;
        
        // Collision-based tackling (mass * velocity)
        for (let i = players.length - 1; i >= 0; i--) {
            let opp = players[i];
            if (opp.team !== ball.owner.team && dist(opp, ball.owner) < 20 && opp.actionCooldown <= 0) {
                // Momentum: mass × speed
                const atkMomentum = ball.owner.mass * Math.hypot(ball.owner.vx, ball.owner.vy) + ball.owner.ozellikler.hiz * 0.5;
                const defMomentum = opp.mass * Math.hypot(opp.vx, opp.vy) + opp.ozellikler.defans * 0.8;
                const tackleRoll = Math.random() * 30;
                
                if (defMomentum + tackleRoll > atkMomentum) {
                    // Check foul
                    const foulChance = 0.15 + (Math.hypot(opp.vx, opp.vy) > 3 ? 0.15 : 0); // slide tackle = higher foul risk
                    if (Math.random() < foulChance) {
                        ball.owner.actionCooldown = 40;
                        opp.actionCooldown = 40;
                        stateMachine = "SET_PIECE";
                        setPieceTimer = 120;
                        setPieceTeam = ball.owner.team;
                        
                        const inBox = Math.abs(ball.y - opp.team.defendY) < 150 && Math.abs(ball.x - GAME_WIDTH/2) < 120;
                        setPieceType = inBox ? "PENALTI" : "FRİKİK";
                        
                        let eventMsg = `${setPieceType}! ${opp.ad} sert girdi.`;
                        if (Math.random() < 0.3) {
                            if (Math.random() < 0.1) {
                                eventMsg += ` 🟥 KIRMIZI KART!`;
                                players.splice(i, 1);
                            } else {
                                eventMsg += ` 🟨 SARI KART!`;
                            }
                        }
                        showEvent(eventMsg, 3000);
                        ball.vx = 0; ball.vy = 0; ball.vz = 0;
                        if (setPieceType === "PENALTI") {
                            ball.x = GAME_WIDTH/2;
                            ball.y = opp.team.defendY === 0 ? 110 : GAME_HEIGHT-110;
                        }
                        return;
                    } else {
                        // Clean tackle with push-back (collision physics)
                        const pushDir = normalize(ball.owner.x - opp.x, ball.owner.y - opp.y);
                        const pushForce = (defMomentum - atkMomentum) * 0.02;
                        ball.owner.vx += pushDir.x * pushForce;
                        ball.owner.vy += pushDir.y * pushForce;
                        
                        showEvent(Math.hypot(opp.vx, opp.vy) > 3 ? "Kayarak müdahale!" : "Omuz omuza!", 500);
                        ball.owner.actionCooldown = 25;
                        ball.owner = opp;
                        opp.state = 'WITH_BALL';
                        opp.hasBallTime = 0;
                        ball.lastTouchedBy = opp;
                        return;
                    }
                } else {
                    // Attacker wins: defender bounces off
                    const pushDir = normalize(opp.x - ball.owner.x, opp.y - ball.owner.y);
                    opp.vx += pushDir.x * 2;
                    opp.vy += pushDir.y * 2;
                    opp.actionCooldown = 15;
                }
            }
        }
        
    } else {
        // Interception: reach radius based on defans stat; yavaş top için daha kolay devralma
        let bestClaim = null; let bestDist = 9999;
        const slowBall = ball.speed < 1.35;
        const stallPickup = ball.stallTicks > 18;
        const speedLimit = stallPickup ? 22 : (slowBall ? 19 : 16);
        players.forEach(p => {
            let reachRadius = 16 + (p.ozellikler.defans / 12);
            if (slowBall || stallPickup) reachRadius += stallPickup ? 14 : 8;
            const d = dist(p, ball);
            if (d < reachRadius && ball.speed < speedLimit && p.actionCooldown <= 0 && d < bestDist) {
                bestDist = d; bestClaim = p;
            }
        });
        if (bestClaim) {
            ball.owner = bestClaim; bestClaim.state = 'WITH_BALL';
            bestClaim.hasBallTime = 0; ball.lastTouchedBy = bestClaim;
            ball.targetPlayer = null;
            ball.z = 0; ball.vz = 0;
        }
    }

    const teamPossession = getTeamWithBall();
    const markingAssignments = new Map();
    if (teamPossession) {
        const defendingTeam = teamPossession === team1 ? team2 : team1;
        buildMarkAssignments(defendingTeam, teamPossession).forEach((mark, defender) => {
            markingAssignments.set(defender, mark);
        });
    }

    // Player AI
    players.forEach(p => {
        const playerIsGK = isGoalkeeper(p);
        
        // Stamina logic: 90 dakikada kimse sürekli %100 kalmaz; kısa dinlenmeler sadece maç içi tavana kadar toparlar.
        applyPassiveStamina(p, playerIsGK);
        
        // Yorgunluk etkisi: Özellikleri düşür (Kondisyon %100'den düştükçe)
        const staminaDrop = 100 - p.stamina;
        p.ovr = Math.round(Math.max(1, p.baseOvr - staminaDrop * (p.baseOvr / 115)));
        p.ozellikler.hiz = Math.round(Math.max(1, p.baseOzellikler.hiz - staminaDrop * (p.baseOzellikler.hiz / 115)));
        p.ozellikler.sut = Math.round(Math.max(1, p.baseOzellikler.sut - staminaDrop * (p.baseOzellikler.sut / 115)));
        p.ozellikler.pas = Math.round(Math.max(1, p.baseOzellikler.pas - staminaDrop * (p.baseOzellikler.pas / 115)));
        p.ozellikler.defans = Math.round(Math.max(1, p.baseOzellikler.defans - staminaDrop * (p.baseOzellikler.defans / 115)));
        p.ozellikler.kaleci = Math.round(Math.max(1, p.baseOzellikler.kaleci - staminaDrop * (p.baseOzellikler.kaleci / 130)));

        let speedMult = (p.ozellikler.hiz / 100) * 4.0; // Base speed based on 'hiz'
        // Fatigue effect: drop to 50% speed if exhausted
        speedMult *= Math.max(0.5, p.stamina / 100); 

        if (p.actionCooldown > 0) p.actionCooldown--;
        if (p.burstCooldown > 0) p.burstCooldown--;

        if (p === ball.owner) {
            // DECISION ENGINE: HAS BALL (FM-Style)
            p.possessionTicks = (p.possessionTicks || 0) + 1;
            
            const distToGoal = Math.abs(p.y - p.team.goalY);
            
            if (playerIsGK) {
                const gkHold = goalkeeperTarget(p);
                const gkDir = normalize(gkHold.x - p.x, gkHold.y - p.y);
                const gkDist = dist(p, gkHold);
                p.vx = gkDist > 6 ? gkDir.x * Math.min(speedMult * 0.45, 2.2) : 0;
                p.vy = gkDist > 6 ? gkDir.y * Math.min(speedMult * 0.45, 2.2) : 0;
                if (p.actionCooldown <= 0 && p.hasBallTime > 14) {
                    goalkeeperDistribute(p);
                }
                return;
            }

            if (p.actionCooldown <= 0) {
                let closeOpponents = 0;
                players.forEach(opp => {
                    if (opp.team !== p.team && dist(p, opp) < 58) closeOpponents++;
                });
                const brain = p.brain || makeFootballBrain(p.ozellikler, p.ovr, p.rol);

                // === 0. 1'E 1 TESPİTİ: Kaleci dışında araya giren defansör yok mu? ===
                // Oyuncu ile rakip kale arasındaki şerit içinde sadece kaleci varsa → anında şut
                const oppGK = players.find(op =>
                    op.team !== p.team && isGoalkeeper(op)
                );
                let isOneOnOne = false;
                if (oppGK && distToGoal < 700 && !playerIsGK) {
                    // Oyuncunun kaleye doğru gittiğini kontrol et
                    const movingToGoal = (p.team.dirY === -1 && (p.vy < -0.3 || distToGoal < 220))
                                      || (p.team.dirY ===  1 && (p.vy >  0.3 || distToGoal < 220));
                    if (movingToGoal) {
                        // Oyuncu ile kaleci arasında başka rakip savunucu var mı?
                        const minY = Math.min(p.y, oppGK.y);
                        const maxY = Math.max(p.y, oppGK.y);
                        let blockerCount = 0;
                        players.forEach(opp => {
                            if (opp.team === p.team || opp === oppGK) return;
                            if (!isGoalkeeper(opp) &&
                                opp.y > minY && opp.y < maxY &&
                                Math.abs(opp.x - p.x) < 55) {
                                blockerCount++;
                            }
                        });
                        isOneOnOne = (blockerCount === 0);
                    }
                }

                // 1. Shoot?
                // 1'e 1 durumunda mesafeden bağımsız, hemen şut çek
                const forceShot = isOneOnOne;
                if (forceShot || distToGoal < 340) {
                    let pathClear = true;
                    if (!forceShot && distToGoal > 80) {
                        players.forEach(opp => {
                            if (opp.team !== p.team && dist(opp, p) < distToGoal && 
                                Math.abs(opp.x - p.x) < 40 && opp.y > Math.min(p.y, p.team.goalY) && opp.y < Math.max(p.y, p.team.goalY)) {
                                pathClear = false;
                            }
                        });
                        if (lanePressure(p, {x: GAME_WIDTH / 2, y: p.team.goalY}, p.team, 44) > 82) {
                            pathClear = false;
                        }
                    }
                    
                    // High probability to shoot if in box and clear, or just very close
                    const shotChance = distToGoal < 145 ? 0.86 : (distToGoal < 240 ? 0.52 : 0.20);
                    if (forceShot || distToGoal < 115 || (pathClear && Math.random() < shotChance)) {
                        const errSut = ((100 - p.ozellikler.sut) / 100) * Math.max(0.42, 1 - brain.composure / 175);
                        const distFactor = distToGoal / 250;
                        // 1'e 1'de plase/köşe şansı yüksek
                        const usePlase = (distToGoal < 165 || forceShot) && Math.random() < (forceShot ? 0.82 : 0.58);
                        
                        if (usePlase) {
                            // Kaleciyi bul, ondan uzak köşeye gönder
                            const gkOffsetX = oppGK ? (oppGK.x - GAME_WIDTH/2) : 0;
                            // Kaleciyle zıt köşeye at
                            const cornerSide = gkOffsetX > 0 ? -1 : 1;
                            const gX = GAME_WIDTH/2 + cornerSide * (38 + Math.random() * 28);
                            const errX = (Math.random() * 96 - 48) * errSut;
                            const dir = normalize((gX + errX) - p.x, p.team.goalY - p.y);
                            const power = 11.5 + (p.ozellikler.sut / 16);
                            ball.vx = dir.x * power; ball.vy = dir.y * power;
                            ball.vz = 1 + Math.random() * 2;
                            ball.spinX = (Math.random() - 0.5) * 0.8;
                            ball.spinY = 0;
                            showEvent(forceShot ? '🎯 1\'e 1 — Plase!' : '🎯 Plase!', 800);
                        } else {
                            const gX = GAME_WIDTH/2 + (Math.random() * 80 - 40);
                            const totalErr = errSut + distFactor * 0.36;
                            const errX = (Math.random() * 300 - 150) * totalErr;
                            const dir = normalize((gX + errX) - p.x, p.team.goalY - p.y);
                            const power = 17 + (p.ozellikler.sut / 11);
                            ball.vx = dir.x * power; ball.vy = dir.y * power;
                            const strikePoint = Math.random();
                            if (strikePoint < 0.3) { ball.vz = 4 + Math.random() * 3; } 
                            else if (strikePoint < 0.6) { ball.vz = 1 + Math.random(); } 
                            else { ball.vz = 0; ball.spinX = (Math.random()-0.5) * 0.3; }
                            showEvent(forceShot ? '🦵 1\'e 1 — Şut!' : (distToGoal < 120 ? '🦵 Sert Şut!' : '🦵 Uzak Şut!'), 800);
                        }
                        playKickSound(true);
                        ball.owner = null; p.actionCooldown = 40;
                        return;
                    }
                }
                
                // 2. Pass Evaluation (vision + receiver space + through-ball timing)
                if (p.hasBallTime > 10 || closeOpponents > 0) {
                    const smartPass = chooseSmartPass(p, closeOpponents);
                    let oppPressing = false;
                    players.forEach(opp => { if (opp.team !== p.team && dist(p, opp) < 44) oppPressing = true; });

                    const keepBias = brain.pressResistance > 74 && closeOpponents < 2 && distToGoal > 96 && p.hasBallTime < 70;
                    const passThreshold = oppPressing ? -18 : (smartPass?.through ? 18 : 30);
                    if (smartPass && !keepBias && (smartPass.score > passThreshold || p.hasBallTime > 76 || closeOpponents >= 2)) {
                        const errPas = ((100 - p.ozellikler.pas) / 100) * Math.max(0.38, 1 - brain.vision / 165);
                        const errScale = smartPass.through ? 44 : 34;
                        const aim = {
                            x: smartPass.aim.x + (Math.random() * errScale - errScale / 2) * errPas,
                            y: smartPass.aim.y + (Math.random() * errScale - errScale / 2) * errPas,
                        };
                        sendPass(p, smartPass.target, smartPass.power + (Math.random() * 2 - 1) * errPas, smartPass.leadFrames, aim);
                        showEvent(smartPass.through ? "Ara pas!" : "Akıllı pas!", 650);
                        p.actionCooldown = smartPass.through ? 24 : 18;
                        p.hasBallTime = 0;
                        return;
                    }
                }
            }
            
            // 3. Dribbling: first thought is to carry the ball toward goal.
            const goalDrive = normalize(GAME_WIDTH/2 - p.x, p.team.goalY - p.y);
            let dribbleDir = goalDrive;
            const dribblePressure = players.reduce((count, opp) => count + (opp.team !== p.team && dist(p, opp) < 62 ? 1 : 0), 0);
            const skillBurst = trySkillMove(p, dribblePressure, distToGoal);
            let dribbleBoost = 0.98;
            if (skillBurst) {
                dribbleDir = normalize(skillBurst.x, skillBurst.y);
                dribbleBoost = skillBurst.boost;
            }
            
            // Avoid nearby opponents
            let avoidVec = { x: 0, y: 0 };
            players.forEach(opp => {
                if (opp.team !== p.team) {
                    const d = dist(p, opp);
                    if (d < 80) {
                        avoidVec.x += (p.x - opp.x) / d;
                        avoidVec.y += (p.y - opp.y) / d;
                    }
                }
            });
            
            if (!skillBurst && Math.hypot(avoidVec.x, avoidVec.y) > 0.1) {
                dribbleDir = normalize(goalDrive.x * 1.45 + avoidVec.x * 1.35, goalDrive.y * 1.45 + avoidVec.y * 1.35);
            } else if (!skillBurst) {
                // Drive at goal, with a slight center lane correction.
                dribbleDir = normalize(goalDrive.x + (GAME_WIDTH/2 - p.x)*0.006, goalDrive.y);
            }
            
            p.vx = dribbleDir.x * speedMult * dribbleBoost;
            p.vy = dribbleDir.y * speedMult * dribbleBoost;
            
        } else {
            // NOT BALL OWNER
            let targetX = p.baseX;
            let targetY = p.baseY;
            
            // Goalkeeper specific logic
            if (playerIsGK) {
                const gkTarget = goalkeeperTarget(p);
                targetX = gkTarget.x;
                targetY = gkTarget.y;
                p.state = Math.abs(ball.y - p.team.defendY) < 160 && ball.speed > 4 ? 'GK_DIVE' : 'GK_READY';
            } else {
                // === FM-STYLE TACTICAL ZONAL AI ===
                const ballRelativeX = (ball.x - GAME_WIDTH/2) / (GAME_WIDTH/2);
                const ballRelativeY = ball.y / GAME_HEIGHT;
                // Lateral kayma: defans daha az, forvet biraz daha fazla
                const lateralFactor = isDefender(p) ? 28 : (isMidfielder(p) ? 42 : 52);
                const shiftX = ballRelativeX * lateralFactor;
                targetX = p.baseX + shiftX;

                const isAttacking = teamPossession === p.team;
                const ballInMyHalf = isInOwnHalf(p.team, ball.y);
                const ownHalf = ownHalfBounds(p.team, 36);
                
                if (isAttacking) {
                    if (ball.targetPlayer === p) {
                        targetX = ball.x + ball.vx*6;
                        targetY = ball.y + ball.vy*6;
                        p.state = 'CHASE';
                    } else {
                        p.state = 'SUPPORT';
                        const behindBallY = ball.y - p.team.dirY * 85;
                        const aheadBallY = ball.y + p.team.dirY * 105;

                        if (isDefender(p)) {
                            targetY = p.baseY + p.team.dirY * 80;
                            targetY = p.team.defendY === 0
                                ? Math.min(MID_Y + 45, Math.max(ownHalf.minY, behindBallY - 55))
                                : Math.max(MID_Y - 45, Math.min(ownHalf.maxY, behindBallY + 55));
                        } else if (isMidfielder(p)) {
                            targetY = (p.baseY * 0.55) + (behindBallY * 0.45);
                            targetY = Math.max(90, Math.min(GAME_HEIGHT - 90, targetY));
                        } else {
                            // Forvet: base'in ilerisine atıl fakat çok ileri gitme
                            targetY = p.baseY + p.team.dirY * 60;
                            const offsideLimit = p.team.goalY - p.team.dirY * 55;
                            const baseLimit    = p.baseY + p.team.dirY * 120;
                            targetY = p.team.dirY === -1
                                ? Math.max(Math.min(offsideLimit, baseLimit), targetY)
                                : Math.min(Math.max(offsideLimit, baseLimit), targetY);
                            targetX += (Math.random()-0.5) * 20;
                        }
                    }
                } else if (teamPossession && !isAttacking) {
                    const dToBall = dist(p, ball);
                    const markedOpp = markingAssignments.get(p);
                    const teamDistances = players
                        .filter(m => m.team === p.team && !isGoalkeeper(m))
                        .map(m => ({ m, d: dist(m, ball) }))
                        .sort((a,b)=>a.d-b.d);
                    const pressRank = teamDistances.findIndex(entry => entry.m === p) + 1;
                    const canPress = pressRank === 1
                        && (ballInMyHalf || (!isDefender(p) && dToBall < 185));
                    
                    if (canPress) {
                        targetX = ball.x;
                        targetY = ball.y;
                        p.state = 'CHASE';
                    } else {
                        p.state = 'IDLE';
                        const goalSide = p.team.defendY === 0 ? -1 : 1;
                        const roleOffset = isDefender(p) ? 65 : (isMidfielder(p) ? 155 : 265);
                        if (ballInMyHalf) {
                            targetY = ball.y + goalSide * roleOffset;
                        } else {
                            const depth = isDefender(p) ? 120 : (isMidfielder(p) ? 250 : 360);
                            targetY = p.team.defendY === 0 ? depth : GAME_HEIGHT - depth;
                        }
                        targetY = Math.max(ownHalf.minY, Math.min(ownHalf.maxY, targetY));

                        if (markedOpp) {
                            const goalCenter = {x: GAME_WIDTH/2, y: p.team.defendY};
                            const blockDir = normalize(markedOpp.x - goalCenter.x, markedOpp.y - goalCenter.y);
                            const markGap = isDefender(p) ? 34 : 44;
                            targetX = markedOpp.x - blockDir.x * markGap;
                            targetY = markedOpp.y - blockDir.y * markGap;
                            targetY = Math.max(ownHalf.minY, Math.min(ownHalf.maxY, targetY));
                        } else {
                            let nearestOpp = null; let dOpp = 999;
                            players.forEach(opp => {
                                if (opp.team !== p.team && dist(opp, p) < dOpp) { dOpp = dist(opp,p); nearestOpp = opp; }
                            });
                            if (nearestOpp && dOpp < 160) {
                                const goalCenter = {x: GAME_WIDTH/2, y: p.team.defendY};
                                const blockDir = normalize(nearestOpp.x - goalCenter.x, nearestOpp.y - goalCenter.y);
                                targetX = nearestOpp.x - blockDir.x * 42;
                                targetY = Math.max(ownHalf.minY, Math.min(ownHalf.maxY, nearestOpp.y - blockDir.y * 42));
                            }
                        }
                    }
                } else {
                    // Top sahipsiz — en yakın 2 oyuncu kovar, geri kalanlar zone'unda bekler
                    let myTeamDist = [];
                    players.forEach(m => { if(m.team === p.team) myTeamDist.push({m:m, d:dist(m,ball)}); });
                    myTeamDist.sort((a,b)=>a.d - b.d);
                    const shouldChaseLoose = myTeamDist[0].m === p
                        || (myTeamDist.length > 1 && myTeamDist[1].m === p && (!isDefender(p) || ballInMyHalf));
                    if (shouldChaseLoose) {
                        targetX = ball.x + ball.vx * 3; 
                        targetY = ball.y + ball.vy * 3;
                        p.state = 'CHASE';
                    } else {
                        // Base pozisyonuna yumuşak dön + topun konumuna göre hafif kayma
                        const yShift = (ballRelativeY - 0.5) * 80;
                        targetX = p.baseX + ballRelativeX * (isDefender(p) ? 20 : 35);
                        targetY = p.baseY + (isDefender(p) ? yShift * 0.3 : yShift * 0.55);
                        if (isDefender(p)) {
                            targetY = Math.max(ownHalf.minY, Math.min(ownHalf.maxY, targetY));
                        }
                        p.state = 'IDLE';
                    }
                }

                const target = clampPitch(targetX, targetY, 18);
                targetX = target.x;
                targetY = target.y;
            }

            // === ZONE ANCHOR (Elastik bağ) ===
            // Rol bazlı maksimum base'den uzaklaşma mesafesi
            const zoneRadius = playerIsGK ? 90
                : isDefender(p)    ? 115
                : isMidfielder(p)  ? 175
                : /* forvet */       230;

            const dxFromBase = targetX - p.baseX;
            const dyFromBase = targetY - p.baseY;
            const distFromBase = Math.hypot(dxFromBase, dyFromBase);

            const looseBallChase = !ball.owner && p.state === 'CHASE';
            if (!looseBallChase && distFromBase > zoneRadius) {
                // Base'e doğru elastik çekme — ne kadar uzak, o kadar güçlü
                const excess = distFromBase - zoneRadius;
                const pullStrength = Math.min(0.72, excess / (zoneRadius * 1.8));
                targetX = targetX - dxFromBase * pullStrength;
                targetY = targetY - dyFromBase * pullStrength;
            }

            // Move towards target
            const dir = normalize(targetX - p.x, targetY - p.y);
            const d = dist(p, {x:targetX, y:targetY});
            
            if (d > 10) {
                let curSpeed = p.state === 'CHASE' ? speedMult : speedMult * 0.6;
                if (p.state === 'GK_DIVE') {
                    // GK dive speed is CRITICAL - based on kaleci XP (range 4-11 px/frame)
                    curSpeed = 4 + (p.ozellikler.kaleci / 100) * 7.0;
                }
                p.vx = dir.x * curSpeed;
                p.vy = dir.y * curSpeed;
            } else {
                p.vx *= 0.8; p.vy *= 0.8; // smooth stop
            }
        }

        // Apply physics
        const prevMoveX = p.x;
        const prevMoveY = p.y;
        p.x += p.vx; p.y += p.vy;
        
        // Bounds
        if(p.x < 15) p.x=15; if(p.x > GAME_WIDTH-15) p.x=GAME_WIDTH-15;
        if(p.y < 15) p.y=15; if(p.y > GAME_HEIGHT-15) p.y=GAME_HEIGHT-15;
        if (playerIsGK) {
            const gkSafe = clampGoalkeeperArea(p, p.x, p.y);
            p.x = gkSafe.x;
            p.y = gkSafe.y;
        }
        const movedDistance = Math.hypot(p.x - prevMoveX, p.y - prevMoveY);
        let fatigueIntensity = playerIsGK ? 0.45 : 0.9;
        if (p === ball.owner) fatigueIntensity += 0.75;
        if (p.state === 'CHASE') fatigueIntensity += 0.55;
        if (p.state === 'SUPPORT') fatigueIntensity += 0.15;
        if (Math.hypot(p.vx, p.vy) > 3.0) fatigueIntensity += 0.35;
        applyMovementFatigue(p, movedDistance, fatigueIntensity);
    });
    separatePlayers();
    updateDebugPanel();
}

function drawPitchLine(x1, y1, x2, y2) {
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
}

function drawPlayerToken(p) {
    const fatigue = Math.max(0.34, p.stamina / 100);
    const radius = isGoalkeeper(p) ? 14 : 12;
    const kit = p.team.color;

    const shadowGradient = ctx.createRadialGradient(p.x + 4, p.y + 5, 2, p.x + 4, p.y + 5, 20);
    shadowGradient.addColorStop(0, 'rgba(0,0,0,.48)');
    shadowGradient.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = shadowGradient;
    ctx.beginPath();
    ctx.ellipse(p.x + 4, p.y + 7, 19, 10, 0, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(p.x, p.y, radius, 0, Math.PI * 2);
    ctx.fillStyle = kit;
    ctx.fill();

    const shine = ctx.createRadialGradient(p.x - 4, p.y - 5, 1, p.x, p.y, radius + 3);
    shine.addColorStop(0, 'rgba(255,255,255,.5)');
    shine.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = shine;
    ctx.fill();

    ctx.strokeStyle = p === ball.owner ? '#f8d66d' : `rgba(255,255,255,${0.35 + fatigue * 0.55})`;
    ctx.lineWidth = p === ball.owner ? 3 : 2;
    ctx.stroke();

    if (p.state === 'CHASE' || p.state === 'GK_DIVE') {
        ctx.strokeStyle = p.team === team1 ? 'rgba(147,197,253,.52)' : 'rgba(252,165,165,.5)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(p.x - p.vx * 5, p.y - p.vy * 5);
        ctx.lineTo(p.x - p.vx * 14, p.y - p.vy * 14);
        ctx.stroke();
    }

    ctx.fillStyle = '#fff';
    ctx.font = '900 10px Segoe UI, system-ui';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(p.numara, p.x, p.y);

    const label = String(p.ad || '').split(' ').slice(-1)[0] || p.ad || '';
    ctx.font = '800 11px Segoe UI, system-ui';
    ctx.lineWidth = 3;
    ctx.strokeStyle = 'rgba(0,0,0,.72)';
    ctx.strokeText(label, p.x, p.y + 24);
    ctx.fillStyle = 'rgba(255,255,255,.94)';
    ctx.fillText(label, p.x, p.y + 24);

    ctx.fillStyle = p.ovr > 80 ? '#f8d66d' : '#bbf7d0';
    ctx.font = '800 9px Consolas, monospace';
    ctx.strokeStyle = 'rgba(0,0,0,.65)';
    ctx.lineWidth = 2;
    ctx.strokeText(`${p.ovr}`, p.x, p.y - 19);
    ctx.fillText(`${p.ovr}`, p.x, p.y - 19);

    ctx.fillStyle = 'rgba(0,0,0,.42)';
    ctx.fillRect(p.x - 12, p.y + 31, 24, 3);
    ctx.fillStyle = p.stamina > 50 ? '#4ade80' : (p.stamina > 20 ? '#facc15' : '#ef4444');
    ctx.fillRect(p.x - 12, p.y + 31, 24 * (p.stamina / 100), 3);
}

function draw() {
    const grass = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
    grass.addColorStop(0, '#1d6b45');
    grass.addColorStop(.5, '#258454');
    grass.addColorStop(1, '#165a3b');
    ctx.fillStyle = grass;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    for (let i = 0; i < 12; i++) {
        ctx.fillStyle = i % 2 === 0 ? 'rgba(255,255,255,.045)' : 'rgba(0,0,0,.035)';
        ctx.fillRect(0, i * (GAME_HEIGHT / 12), GAME_WIDTH, GAME_HEIGHT / 12);
    }
    for (let x = 0; x < GAME_WIDTH; x += 48) {
        ctx.strokeStyle = 'rgba(255,255,255,.026)';
        ctx.lineWidth = 1;
        drawPitchLine(x, 0, x, GAME_HEIGHT);
    }

    ctx.strokeStyle = 'rgba(236,253,245,.74)';
    ctx.lineWidth = 3;
    ctx.strokeRect(12, 12, GAME_WIDTH - 24, GAME_HEIGHT - 24);
    drawPitchLine(12, GAME_HEIGHT / 2, GAME_WIDTH - 12, GAME_HEIGHT / 2);
    ctx.beginPath();
    ctx.arc(GAME_WIDTH / 2, GAME_HEIGHT / 2, 62, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(GAME_WIDTH / 2, GAME_HEIGHT / 2, 4, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(236,253,245,.88)';
    ctx.fill();

    ctx.strokeStyle = 'rgba(236,253,245,.68)';
    ctx.lineWidth = 3;
    ctx.strokeRect(GAME_WIDTH / 2 - 155, 12, 310, 122);
    ctx.strokeRect(GAME_WIDTH / 2 - 155, GAME_HEIGHT - 134, 310, 122);
    ctx.strokeRect(GAME_WIDTH / 2 - 64, 12, 128, 38);
    ctx.strokeRect(GAME_WIDTH / 2 - 64, GAME_HEIGHT - 50, 128, 38);

    ctx.fillStyle = '#f8fafc';
    ctx.fillRect(GAME_WIDTH / 2 - 82, 5, 164, 7);
    ctx.fillRect(GAME_WIDTH / 2 - 82, GAME_HEIGHT - 12, 164, 7);
    ctx.fillStyle = 'rgba(15,23,42,.8)';
    ctx.fillRect(GAME_WIDTH / 2 - 72, 7, 144, 5);
    ctx.fillRect(GAME_WIDTH / 2 - 72, GAME_HEIGHT - 12, 144, 5);

    players
        .slice()
        .sort((a, b) => a.y - b.y)
        .forEach(drawPlayerToken);

    const shadowSize = Math.max(4, 9 - ball.z * 0.12);
    ctx.fillStyle = 'rgba(0,0,0,0.34)';
    ctx.beginPath();
    ctx.ellipse(ball.x + 2, ball.y + 3 + ball.z * 0.35, shadowSize + 2, shadowSize * 0.7, 0, 0, Math.PI * 2);
    ctx.fill();

    const ballDrawY = ball.y - ball.z;
    const ballSize = Math.max(5, 7 + ball.z * 0.13);
    const ballGradient = ctx.createRadialGradient(ball.x - 2, ballDrawY - 2, 1, ball.x, ballDrawY, ballSize + 1);
    ballGradient.addColorStop(0, '#fff');
    ballGradient.addColorStop(.66, ball.z > 3 ? '#fde047' : '#f8fafc');
    ballGradient.addColorStop(1, '#cbd5e1');
    ctx.beginPath();
    ctx.arc(ball.x, ballDrawY, ballSize, 0, Math.PI * 2);
    ctx.fillStyle = ballGradient;
    ctx.fill();
    ctx.lineWidth = 1.5;
    ctx.strokeStyle = '#0f172a';
    ctx.stroke();

    if (ball.speed > 4) {
        ctx.strokeStyle = 'rgba(250,204,21,.42)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(ball.x, ballDrawY);
        ctx.lineTo(ball.x - ball.vx * 3.4, ballDrawY - ball.vy * 3.4);
        ctx.stroke();
    }

    const spinMag = Math.hypot(ball.spinX || 0, ball.spinY || 0);
    if (spinMag > 0.05 && ball.z > 1) {
        ctx.strokeStyle = 'rgba(255,220,90,0.58)';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(ball.x, ballDrawY);
        ctx.lineTo(ball.x + (ball.spinX || 0) * 40, ballDrawY + (ball.spinY || 0) * 40);
        ctx.stroke();
    }
}

function gameLoop() {
    try {
        update();
        draw();
    } catch (e) {
        console.error("Game loop error:", e);
        // Continue animation even if error happens to prevent freeze
    }
    requestAnimationFrame(gameLoop);
}
// ========== HALFTIME SYSTEM ==========

function startHalftime() {
    stateMachine = "HALFTIME";
    htTeamReady = false;
    
    // Show overlay
    const overlay = document.getElementById('halftime-overlay');
    overlay.classList.add('active');
    document.getElementById('ht-score').textContent = `${score1} - ${score2}`;
    document.getElementById('ht-ready-btn').style.display = '';
    document.getElementById('ht-ready-btn').textContent = '✅ Taktikleri Onayla (2. Yarıya Hazırım)';
    document.getElementById('ht-status').textContent = 'Taktik değişikliklerinizi yapın. Onayladığınızda 2. yarı başlayacaktır.';
    
    // Hide countdown
    const countdownEl = document.getElementById('ht-countdown');
    if (countdownEl) countdownEl.style.display = 'none';
}

function openTaktik() {
    // Open tactic screen in new window (parent page's tactic URL)
    const taktikUrl = "{{ url_for('ogrenci_taktik') }}";
    window.open(taktikUrl, "TaktikEkrani", "width=800,height=700,resizable=yes");
}

function htReady() {
    htTeamReady = true;
    document.getElementById('ht-ready-btn').style.display = 'none';
    document.getElementById('ht-status').textContent = `✅ Hazırsınız! 2. Yarı başlıyor...`;
    
    endHalftime();
}

function endHalftime() {
    
    // Hide overlay
    document.getElementById('halftime-overlay').classList.remove('active');
    
    // Mark second half
    isSecondHalf = true;
    stateMachine = "PLAYING";
    
    // Reset positions for 2nd half (swap sides)
    players.forEach(p => {
        p.baseX = GAME_WIDTH - p.baseX;
        p.baseY = GAME_HEIGHT - p.baseY;
        p.x = p.baseX; p.y = p.baseY;
        p.vx = 0; p.vy = 0;
        const htRecoveryCap = isGoalkeeper(p) ? 96 : (isMidfielder(p) ? 90 : 92);
        p.stamina = Math.min(htRecoveryCap, p.stamina + 10 + p.baseOvr / 18);
        p.state = 'IDLE';
        p.actionCooldown = 0;
    });
    
    // Swap team directions
    [team1.dirY, team2.dirY] = [team2.dirY, team1.dirY];
    [team1.goalY, team2.goalY] = [team2.goalY, team1.goalY];
    [team1.defendY, team2.defendY] = [team2.defendY, team1.defendY];
    
    // Ball to center
    ball.x = GAME_WIDTH/2; ball.y = GAME_HEIGHT/2;
    ball.vx = 0; ball.vy = 0; ball.owner = null; ball.targetPlayer = null;
    ball.stallTicks = 0;
    
    showEvent("2. Yarı Başlıyor!", 3000);
}

loadData();

</script>
