<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2D FM Maç Motoru (Pro)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --ui-bg: rgba(3, 10, 8, .88);
      --ui-line: rgba(209, 250, 229, .16);
      --ui-gold: #d6b35a;
      --ui-green: #21c070;
      --ui-red: #ef4444;
      --ui-muted: rgba(226, 245, 238, .64);
    }
    body {
      background:
        radial-gradient(circle at 50% -10%, rgba(33,192,112,.18), transparent 32%),
        linear-gradient(180deg, #020706 0%, #07120f 52%, #000 100%);
      color: #fff; margin: 0; overflow: hidden;
      font-family: 'Segoe UI', system-ui, sans-serif;
    }
    @keyframes pulse-banner {
      0%,100% { opacity:1; transform:translateX(-50%) scale(1); }
      50%      { opacity:.85; transform:translateX(-50%) scale(1.04); }
    }
    @keyframes ticker-in {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    #game-container { position: relative; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
    #header {
      min-height: 86px;
      background: linear-gradient(180deg, rgba(3,10,8,.96), rgba(6,18,14,.92));
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: stretch;
      gap: 12px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--ui-line);
      box-shadow: 0 16px 42px rgba(0,0,0,.42);
      z-index: 30;
    }
    .team-card {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      border: 1px solid var(--ui-line);
      border-radius: 12px;
      background: rgba(255,255,255,.045);
      padding: 10px 12px;
    }
    .team-card.away { justify-content: flex-end; text-align: right; }
    .crest {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      color: #03110b;
      font-size: 20px;
      font-weight: 950;
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.28), 0 10px 20px rgba(0,0,0,.35);
    }
    .crest.home { background: linear-gradient(135deg, #93c5fd, #2563eb); color:white; }
    .crest.away { background: linear-gradient(135deg, #fecaca, #dc2626); color:white; }
    .team-label {
      color: var(--ui-muted);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    .team-name {
      max-width: 28vw;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      color: #fff;
      font-size: 16px;
      font-weight: 950;
      line-height: 1.1;
    }
    #score-board {
      min-width: 210px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(214,179,90,.38);
      border-radius: 12px;
      background:
        linear-gradient(90deg, transparent, rgba(214,179,90,.08), transparent),
        rgba(0,0,0,.46);
      padding: 8px 16px;
      text-align: center;
    }
    .clock-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--ui-gold);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .score-line {
      color: #fff;
      font-size: 34px;
      font-weight: 950;
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }
    .phase-line {
      margin-top: 3px;
      color: var(--ui-muted);
      font-size: 11px;
      font-weight: 800;
    }
    #canvas-wrap {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 50%, rgba(33,192,112,.16), transparent 42%),
        linear-gradient(180deg,#06110d,#020706);
    }
    #canvas-wrap::before {
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background: linear-gradient(90deg, rgba(255,255,255,.025) 1px, transparent 1px) 0 0 / 48px 48px;
      opacity:.35;
    }
    canvas {
      background: #2f855a;
      border: 1px solid rgba(236,253,245,.78);
      border-radius: 10px;
      box-shadow: 0 26px 80px rgba(0,0,0,0.66), 0 0 0 10px rgba(255,255,255,.035);
      max-width: 100%; max-height: 100%;
    }
    #event-overlay {
      position: absolute; bottom: 86px; left: 50%; transform: translateX(-50%);
      min-width: min(520px, calc(100vw - 28px));
      background: rgba(3,10,8,0.88); color: #fff; padding: 12px 18px; border-radius: 999px;
      border:1px solid rgba(214,179,90,.36);
      font-weight: 900; font-size: 15px; opacity: 0; transition: opacity 0.3s; pointer-events: none;
      text-align:center;
      box-shadow: 0 14px 44px rgba(0,0,0,.45);
    }
    #broadcast-panel {
      position:absolute;
      left:14px;
      top:14px;
      z-index:20;
      width:min(260px, calc(100vw - 28px));
      border:1px solid var(--ui-line);
      border-radius:12px;
      background:var(--ui-bg);
      box-shadow:0 18px 50px rgba(0,0,0,.38);
      overflow:hidden;
      pointer-events:none;
    }
    .panel-head {
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:8px;
      border-bottom:1px solid var(--ui-line);
      padding:9px 11px;
      color:var(--ui-gold);
      font-size:10px;
      font-weight:950;
      letter-spacing:.14em;
      text-transform:uppercase;
    }
    .live-dot {
      width:7px;
      height:7px;
      border-radius:50%;
      background:#ef4444;
      box-shadow:0 0 0 5px rgba(239,68,68,.16);
    }
    .match-stats {
      display:grid;
      grid-template-columns:repeat(3,1fr);
      gap:1px;
      background:var(--ui-line);
    }
    .stat-cell {
      background:rgba(3,10,8,.86);
      padding:9px 6px;
      text-align:center;
    }
    .stat-value {
      color:white;
      font-size:15px;
      font-weight:950;
      font-variant-numeric:tabular-nums;
    }
    .stat-label {
      color:var(--ui-muted);
      font-size:9px;
      font-weight:900;
      letter-spacing:.1em;
      text-transform:uppercase;
    }
    #ticker {
      position:absolute;
      right:14px;
      bottom:14px;
      z-index:20;
      display:grid;
      gap:7px;
      width:min(320px, calc(100vw - 28px));
      pointer-events:none;
    }
    .ticker-item {
      animation:ticker-in .22s ease both;
      border:1px solid var(--ui-line);
      border-radius:10px;
      background:rgba(3,10,8,.82);
      padding:9px 11px;
      color:rgba(255,255,255,.9);
      font-size:12px;
      font-weight:800;
      box-shadow:0 12px 30px rgba(0,0,0,.3);
    }
    #halftime-overlay {
      position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.92);
      display: none; flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; padding: 20px;
    }
    #halftime-overlay.active { display: flex; }
    #halftime-overlay h2 { font-size: 28px; font-weight: 900; color: #fbbf24; }
    #halftime-overlay .ht-timer { font-size: 48px; font-weight: 900; color: #ef4444; font-family: monospace; }
    #halftime-overlay .ht-btn {
      padding: 12px 28px; border-radius: 12px; font-weight: 900; font-size: 16px;
      cursor: pointer; border: none; transition: transform 0.15s;
    }
    #halftime-overlay .ht-btn:hover { transform: scale(1.05); }
    #halftime-overlay .ht-status { font-size: 14px; color: #94a3b8; }
    #debug-panel {
      position: absolute; left: 10px; bottom: 10px; z-index: 80; display: none;
      max-width: min(540px, calc(100vw - 20px)); padding: 8px 10px;
      background: rgba(0,0,0,0.78); color: #bbf7d0; border: 1px solid rgba(187,247,208,0.35);
      border-radius: 8px; font: 11px/1.35 Consolas, monospace; white-space: pre-wrap;
    }
    .floating-btn {
      border:1px solid rgba(255,255,255,.12);
      border-radius:10px;
      padding:8px 11px;
      color:white;
      font-size:12px;
      font-weight:900;
      box-shadow:0 12px 28px rgba(0,0,0,.28);
    }
    @media (max-width: 760px) {
      #header {
        min-height: 112px;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      #score-board { grid-column: 1 / -1; grid-row: 1; min-width:0; }
      .team-card { grid-row: 2; padding:8px; }
      .team-name { max-width: 32vw; font-size: 13px; }
      .crest { width:34px; height:34px; font-size:16px; }
      .score-line { font-size: 28px; }
      #broadcast-panel { top:10px; left:10px; width:min(230px, calc(100vw - 20px)); }
      #ticker { display:none; }
      #event-overlay { bottom: 20px; font-size: 13px; border-radius: 14px; }
    }
  </style>
</head>
<body>

<div id="game-container">
  <div id="header">
    <div class="team-card home">
      <div class="crest home" id="team1-crest">B</div>
      <div class="min-w-0">
        <div class="team-label">Ev Sahibi</div>
        <div class="team-name" id="team1-name">Bizim Sınıf</div>
      </div>
    </div>
    <div id="score-board">
      <div class="clock-row"><span>Canlı</span><span id="timer">00:00</span></div>
      <div class="score-line"><span id="score1">0</span><span class="text-emerald-100/35 px-3">-</span><span id="score2">0</span></div>
      <div class="phase-line" id="match-phase">Maç yükleniyor</div>
    </div>
    <div class="team-card away">
      <div class="min-w-0">
        <div class="team-label">Deplasman</div>
        <div class="team-name" id="team2-name">Rakip Sınıf</div>
      </div>
      <div class="crest away" id="team2-crest">R</div>
    </div>
    <button onclick="enableMatchAudio()" class="floating-btn absolute right-28 top-[94px] bg-emerald-600 hover:bg-emerald-500 z-50 hidden" id="sound-btn">Sesi Aç</button>
    <button onclick="window.close()" class="floating-btn absolute right-4 top-[94px] bg-red-600 hover:bg-red-500 z-50 hidden" id="close-btn">Pencereyi Kapat</button>
  </div>
  <div id="canvas-wrap">
    <canvas id="pitch"></canvas>
    <div id="broadcast-panel">
      <div class="panel-head"><span>Maç Takibi</span><span class="live-dot"></span></div>
      <div class="match-stats">
        <div class="stat-cell">
          <div class="stat-value" id="hud-poss">50-50</div>
          <div class="stat-label">Momentum</div>
        </div>
        <div class="stat-cell">
          <div class="stat-value" id="hud-speed">0.0</div>
          <div class="stat-label">Top Hızı</div>
        </div>
        <div class="stat-cell">
          <div class="stat-value" id="hud-zone">Orta</div>
          <div class="stat-label">Bölge</div>
        </div>
      </div>
    </div>
    <div id="debug-panel"></div>
    <div id="event-overlay">Maç Başlıyor!</div>
    <div id="ticker"></div>
    <!-- Ses kilidi bannerı -->
    <div id="audio-banner" onclick="enableMatchAudio()" style="
      position:absolute;bottom:12px;left:50%;transform:translateX(-50%);
      background:rgba(16,185,129,0.92);color:#fff;padding:8px 20px;border-radius:20px;
      font-weight:800;font-size:13px;cursor:pointer;z-index:200;
      display:none;box-shadow:0 4px 16px rgba(0,0,0,0.5);
      animation:pulse-banner 1.4s ease-in-out infinite;
    ">🔊 Sesi açmak için tıkla</div>
  </div>
  <!-- Halftime Overlay -->
  <div id="halftime-overlay">
    <h2>⏸️ DEVRE ARASI</h2>
    <div class="text-lg text-slate-300">İlk Yarı: <span id="ht-score" class="text-white font-black"></span></div>
    <div class="ht-timer" id="ht-countdown">2:00</div>
    <button class="ht-btn" style="background:#3b82f6;color:#fff" onclick="openTaktik()">📋 Taktik Ekranını Aç</button>
    <button class="ht-btn" id="ht-ready-btn" style="background:#22c55e;color:#fff" onclick="htReady()">✅ Taktikleri Onayla (2. Yarıya Hazırım)</button>
    <div class="ht-status" id="ht-status">Taktik değişikliklerinizi yapın, süre dolunca 2. yarı başlar.</div>
  </div>
</div>

<script>
// URL Params
const urlParams = new URLSearchParams(window.location.search);
const rakip_id = urlParams.get('rakip_id');
const spor = urlParams.get('spor') || 'futbol';
const debugMode = urlParams.get('debug') === '1';

// Game Engine Config
const FPS = 60;
const GAME_WIDTH = 600;
const GAME_HEIGHT = 900;
const MID_Y = GAME_HEIGHT / 2;
let timeTicks = 0;
const TOTAL_TICKS = 180 * FPS; // 3 dakika gerçek zaman = 90 dk oyun zamanı

// === PHYSICS CONSTANTS ===
const GRASS_FRICTION = 0.965;    // Rolling friction on dry grass
const AIR_DRAG = 0.002;          // Air resistance coefficient
const BOUNCE_RESTITUTION = 0.6;  // Energy kept on bounce (40% loss)
const MAGNUS_COEFF = 0.12;       // Spin curve strength
const PLAYER_MASS = 75;          // kg (for collision calc)

// State
let isPlaying = false;
let score1 = 0, score2 = 0;
let stateMachine = "PLAYING"; // PLAYING, GOAL_CELEBRATION, SET_PIECE, HALFTIME
let isSecondHalf = false;
let htTeamReady = false; // player confirmed tactics
let tickerItems = [];
let lastPhaseText = "";

// Canvas
const canvas = document.getElementById('pitch');
const ctx = canvas.getContext('2d');
const debugPanel = document.getElementById('debug-panel');
if (debugMode && debugPanel) debugPanel.style.display = 'block';
const soundBtn = document.getElementById('sound-btn');
const audio = {
    stadium: new Audio("{{ url_for('static', filename='audio/ortamstadium.mp3') }}"),
    goal: new Audio("{{ url_for('static', filename='audio/gol.mp3') }}"),
    kick: new Audio("{{ url_for('static', filename='audio/topavurus.mp3') }}"),
};
audio.stadium.loop = true;
audio.stadium.volume = 0.32;
audio.goal.volume = 0.9;
audio.kick.volume = 0.55;
let audioUnlocked = false;
let lastKickSoundAt = 0;
canvas.width = GAME_WIDTH;
canvas.height = GAME_HEIGHT;

const audioBanner = document.getElementById('audio-banner');
function hideBanner() {
    if (audioBanner) audioBanner.style.display = 'none';
    if (soundBtn) soundBtn.style.display = 'none';
}
function updateSoundButton() {
    // Banner göster/gizle
    if (audioBanner) audioBanner.style.display = audioUnlocked ? 'none' : 'block';
}
async function enableMatchAudio() {
    audioUnlocked = true;
    hideBanner();
    try {
        if (audio.stadium.paused) {
            audio.stadium.currentTime = audio.stadium.currentTime || 0;
            await audio.stadium.play();
        }
    } catch (e) {
        audioUnlocked = false;
        updateSoundButton();
    }
}
function tryStartStadium() {
    // Otomatik başlatmayı dene; başarısız olursa banner göster
    audio.stadium.play().then(() => {
        audioUnlocked = true;
        hideBanner();
    }).catch(() => {
        // Autoplay engellendi — banner göster
        if (audioBanner) audioBanner.style.display = 'block';
    });
}
function stopStadium() {
    audio.stadium.pause();
}
// Stadyum sesi kesilmez — her 3 saniyede bir kontrol et
setInterval(() => {
    if (audioUnlocked && isPlaying && !stateMachine.includes('HALFTIME') && audio.stadium.paused) {
        audio.stadium.play().catch(() => {});
    }
}, 3000);
function playOneShot(baseAudio, volume = 1) {
    if (!audioUnlocked) return;
    const sound = baseAudio.cloneNode();
    sound.volume = volume;
    sound.play().catch(() => {});
    return sound;
}
function playKickSound(force = false) {
    const now = performance.now();
    if (!force && now - lastKickSoundAt < 110) return;
    lastKickSoundAt = now;
    playOneShot(audio.kick, 0.55);
}
function playGoalSound() {
    playOneShot(audio.goal, 0.9);
}
// Herhangi bir etkileşimde sesi aç (ilk tıklama / tuş)
['pointerdown', 'keydown', 'touchstart'].forEach(evt => {
    window.addEventListener(evt, () => { if (!audioUnlocked) enableMatchAudio(); }, { once: true, passive: true });
});

function resizeCanvas() {
  const wrap = document.getElementById('canvas-wrap');
  const ratio = Math.min(wrap.clientWidth / GAME_WIDTH, wrap.clientHeight / GAME_HEIGHT) * 0.95;
  canvas.style.width = (GAME_WIDTH * ratio) + 'px';
  canvas.style.height = (GAME_HEIGHT * ratio) + 'px';
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function showEvent(text, duration=2000) {
  const el = document.getElementById('event-overlay');
  el.textContent = text;
  el.style.opacity = 1;
  pushTicker(text);
  setTimeout(() => el.style.opacity = 0, duration);
}

function teamInitial(name, fallback) {
    const clean = String(name || fallback || "").trim();
    return (clean.match(/[A-Za-zÇĞİÖŞÜçğıöşü0-9]/) || [fallback || "?"])[0].toLocaleUpperCase('tr-TR');
}

function pushTicker(text) {
    const ticker = document.getElementById('ticker');
    if (!ticker || !text) return;
    const minute = document.getElementById('timer')?.textContent || "00:00";
    tickerItems.unshift({ minute, text });
    tickerItems = tickerItems.slice(0, 4);
    ticker.innerHTML = tickerItems.map(item => `
      <div class="ticker-item">
        <span style="color:var(--ui-gold);font-weight:950;margin-right:8px">${escapeHtml(item.minute)}</span>${escapeHtml(item.text)}
      </div>
    `).join('');
}

function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[ch]);
}

function setMatchPhase(text) {
    if (text === lastPhaseText) return;
    lastPhaseText = text;
    const phase = document.getElementById('match-phase');
    if (phase) phase.textContent = text;
}

function updateBroadcastHud() {
    const poss = document.getElementById('hud-poss');
    const speed = document.getElementById('hud-speed');
    const zone = document.getElementById('hud-zone');
    if (!poss || !speed || !zone) return;

    const teamWithBall = getTeamWithBall();
    let homeMomentum = 50;
    if (teamWithBall === team1) homeMomentum = 62;
    else if (teamWithBall === team2) homeMomentum = 38;
    else {
        const nearestHome = Math.min(...players.filter(p => p.team === team1).map(p => dist(p, ball)).concat([999]));
        const nearestAway = Math.min(...players.filter(p => p.team === team2).map(p => dist(p, ball)).concat([999]));
        homeMomentum = nearestHome <= nearestAway ? 55 : 45;
    }
    poss.textContent = `${homeMomentum}-${100 - homeMomentum}`;
    speed.textContent = `${ball.speed.toFixed(1)}`;
    zone.textContent = ball.y < GAME_HEIGHT * 0.33 ? "Üst" : (ball.y > GAME_HEIGHT * 0.66 ? "Alt" : "Orta");

    if (stateMachine === "HALFTIME") setMatchPhase("Devre arası");
    else if (stateMachine === "SET_PIECE") setMatchPhase(setPieceType || "Duran top");
    else if (stateMachine === "GOAL_CELEBRATION") setMatchPhase("Gol sevinci");
    else if (ball.owner) setMatchPhase(`${ball.owner.team.name} hücumda`);
    else if (ball.speed > 6) setMatchPhase("Geçiş oyunu");
    else setMatchPhase("Top kapma mücadelesi");
}

// Math Utils
function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }
function normalize(dx, dy) { const l = Math.hypot(dx, dy); return l===0 ? {x:0,y:0} : {x:dx/l, y:dy/l}; }
function randomRange(min, max) { return Math.random() * (max - min) + min; }
function ownHalfBounds(team, buffer = 28) {
    return team.defendY === 0
        ? { minY: buffer, maxY: MID_Y - buffer }
        : { minY: MID_Y + buffer, maxY: GAME_HEIGHT - buffer };
}
function isInOwnHalf(team, y) {
    return team.defendY === 0 ? y < MID_Y : y > MID_Y;
}
function clampToOwnHalf(team, x, y, buffer = 28) {
    const b = ownHalfBounds(team, buffer);
    return {
        x: Math.max(18, Math.min(GAME_WIDTH - 18, x)),
        y: Math.max(b.minY, Math.min(b.maxY, y)),
    };
}
function roleText(p) {
    return String(p.rol || "").toLowerCase();
}
function isGoalkeeper(p) {
    return Math.abs(p.baseY - p.team.defendY) < 55 || roleText(p).includes("kaleci");
}
function isDefender(p) {
    const r = roleText(p);
    return isGoalkeeper(p) || r.includes("defans") || r.includes("stoper") || r.includes("bek");
}
function isMidfielder(p) {
    const r = roleText(p);
    return r.includes("orta") || r.includes("merkez") || r.includes("libero");
}
function isForward(p) {
    const r = roleText(p);
    return r.includes("forvet") || r.includes("kanat") || r.includes("hücum") || r.includes("hucum");
}
function clampStat(value, fallback = 55) {
    const n = Number.isFinite(value) ? value : fallback;
    return Math.max(1, Math.min(100, n));
}
function makeFootballBrain(oz, ovr, role) {
    const base = clampStat(ovr, 55);
    const hiz = clampStat(oz.hiz, base);
    const sut = clampStat(oz.sut, base);
    const pas = clampStat(oz.pas, base);
    const defans = clampStat(oz.defans, base);
    const r = String(role || "").toLocaleLowerCase('tr-TR');
    const attackBoost = r.includes("forvet") || r.includes("kanat") || r.includes("hücum") || r.includes("hucum") ? 5 : 0;
    const midfieldBoost = r.includes("orta") || r.includes("merkez") ? 5 : 0;
    return {
        vision: clampStat(Math.round(pas * 0.62 + base * 0.28 + midfieldBoost)),
        composure: clampStat(Math.round(sut * 0.42 + pas * 0.18 + base * 0.34 + attackBoost)),
        flair: clampStat(Math.round(hiz * 0.42 + pas * 0.24 + base * 0.26 + attackBoost)),
        decisions: clampStat(Math.round(pas * 0.46 + defans * 0.16 + base * 0.32 + midfieldBoost)),

function buildMarkAssignments(defTeam, atkTeam) {
    const assignments = new Map();
    const defenders = players
        .filter(p => p.team === defTeam && !isGoalkeeper(p))
        .sort((a, b) => {
            const roleA = isDefender(a) ? 0 : (isMidfielder(a) ? 1 : 2);
            const roleB = isDefender(b) ? 0 : (isMidfielder(b) ? 1 : 2);
            return roleA - roleB || Math.abs(a.baseY - defTeam.defendY) - Math.abs(b.baseY - defTeam.defendY);
        });
    const threats = players
        .filter(p => p.team === atkTeam && !isGoalkeeper(p))
        .sort((a, b) => threatScoreFor(defTeam, b) - threatScoreFor(defTeam, a));

    threats.forEach(threat => {
        let bestDef = null;
        let bestScore = Infinity;
        defenders.forEach(def => {
            if (assignments.has(def)) return;
            let score = dist(def, threat);
            if (isDefender(def) && isForward(threat)) score -= 45;
            if (isMidfielder(def) && isMidfielder(threat)) score -= 25;
            if (!isDefender(def) && isForward(threat)) score += 25;
            score += Math.abs(def.baseX - threat.x) * 0.15;
            if (score < bestScore) {
                bestScore = score;
                bestDef = def;
            }
        });
        if (bestDef) assignments.set(bestDef, threat);
    });
    return assignments;
}

    const gap = GAME_WIDTH / (playersOnLine.length + 1);

function normalizeTeamShape(team) {
    const roster = players.filter(p => p.team === team);
    if (!roster.length) return;

    let gk = roster.find(p => roleText(p).includes("kaleci"))
        || roster.find(p => Math.abs(p.baseY - team.defendY) < 95)
        || roster.reduce((best, p) =>
            Math.abs(p.baseY - team.defendY) < Math.abs(best.baseY - team.defendY) ? p : best
        );

    gk.rol = "Kaleci";
    if (Math.abs(gk.baseY - team.defendY) > 115 || Math.abs(gk.baseX - GAME_WIDTH / 2) > 160) {
        gk.baseX = GAME_WIDTH / 2;
        gk.baseY = team.defendY === 0 ? 28 : GAME_HEIGHT - 28;
    }

    const fieldPlayers = roster.filter(p => p !== gk);
    if (!fieldPlayers.length) return;

    const ys = fieldPlayers.map(p => p.baseY);
    const ySpan = Math.max(...ys) - Math.min(...ys);
    if (ySpan < 180 && fieldPlayers.length >= 8) {
        const ordered = fieldPlayers.slice().sort((a, b) => a.numara - b.numara);
        spreadLine(ordered.slice(0, 4), formationLine(team, 205));
        spreadLine(ordered.slice(4, 8), formationLine(team, 415));
        spreadLine(ordered.slice(8), formationLine(team, 635));
    }

    fieldPlayers.forEach(p => {
        const r = roleText(p);
        if (r && r !== "oyuncu") return;
        const depth = Math.abs(p.baseY - team.defendY);
        if (depth < 310) p.rol = "Defans";
        else if (depth < 560) p.rol = "Orta Saha";
        else p.rol = "Forvet";
    });
}

function clampPlayerToPitch(p) {

    p.x = safe.x;
    p.y = safe.y;
    if (isGoalkeeper(p)) {
        const gkSafe = clampGoalkeeperArea(p, p.x, p.y);
        p.x = gkSafe.x;
        p.y = gkSafe.y;
    }

function separatePlayers() {
    for (let pass = 0; pass < 2; pass++) {
        for (let i = 0; i < players.length; i++) {
            for (let j = i + 1; j < players.length; j++) {
                const a = players[i];
                const b = players[j];
                const sameTeam = a.team === b.team;
                const minGap = sameTeam ? 28 : 25;
                let dx = b.x - a.x;
                let dy = b.y - a.y;
                let d = Math.hypot(dx, dy);
                if (d >= minGap) continue;
                if (d < 0.01) {
                    const angle = (i + j + pass) * 1.7;
                    dx = Math.cos(angle);
                    dy = Math.sin(angle);
                    d = 1;
                }
                const nx = dx / d;
                const ny = dy / d;
                const overlap = minGap - d;
                let aWeight = isGoalkeeper(a) ? 0.4 : 1;
                let bWeight = isGoalkeeper(b) ? 0.4 : 1;
                if (a === ball.owner) aWeight *= 0.45;
                if (b === ball.owner) bWeight *= 0.45;
                if (stateMachine === "SET_PIECE") {
                    if (a === ball.owner) aWeight = 0;
                    if (b === ball.owner) bWeight = 0;
                }
                const total = aWeight + bWeight || 1;
                a.x -= nx * overlap * (bWeight / total);
                a.y -= ny * overlap * (bWeight / total);
                b.x += nx * overlap * (aWeight / total);
                b.y += ny * overlap * (aWeight / total);
                clampPlayerToPitch(a);
                clampPlayerToPitch(b);
            }
        }
    }
    if (ball.owner) {
        ball.x = ball.owner.x;
        ball.y = ball.owner.y;
    }
}

function resetPositions(fullStaminaReset = false) {

        if (fullStaminaReset) {
            p.stamina = 100;
            p.distanceCovered = 0;
            p.sprintTicks = 0;
            p.possessionTicks = 0;

    });
    ball.x = GAME_WIDTH/2; ball.y = GAME_HEIGHT/2; ball.z = 0;
    ball.vx = 0; ball.vy = 0; ball.vz = 0;
    ball.spinX = 0; ball.spinY = 0;
    ball.owner = null; ball.targetPlayer = null;
    ball.lastTouchedBy = null;
    ball.stallTicks = 0;

}
