{% extends "base.html" %}
{% block title %}Sınav Analizi{% endblock %}

{% block body %}
<main class="max-w-7xl mx-auto px-3 sm:px-4 py-4 pb-24 text-slate-800">
  <header class="mb-4 rounded-2xl border border-amber-200 bg-gradient-to-br from-amber-50 to-white p-4 shadow-sm">
    <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-3">
      <div>
        <h1 class="text-xl sm:text-2xl font-black text-amber-900 tracking-tight">ECO Sınav Analiz</h1>
        <p class="text-xs sm:text-sm text-slate-600 mt-1 max-w-3xl">
          Okul, öğretmen ve öğrenci bilgileri ECO’dan hazır gelir. Sadece sınıf, ders, sınav bilgisi,
          TYMM öğrenme çıktıları ve puan alanlarını seçip raporu yazdırabilirsiniz.
        </p>
      </div>
      <a href="{{ url_for('dashboard') }}" class="shrink-0 inline-flex items-center justify-center rounded-xl bg-okul-800 text-white text-xs font-bold px-4 py-2 hover:bg-okul-900">← Ana menü</a>
    </div>
  </header>

  <div class="mb-3 flex flex-wrap gap-2">
    <button type="button" id="btn-sunucu-kaydet" class="inline-flex items-center justify-center rounded-xl bg-emerald-700 text-white text-xs font-bold px-4 py-2 hover:bg-emerald-800">Kaydet</button>
    <button type="button" id="btn-kayitlar" class="inline-flex items-center justify-center rounded-xl border border-amber-300 bg-white text-amber-900 text-xs font-bold px-4 py-2 hover:bg-amber-50">Kayıtlar</button>
  </div>

  <nav class="flex flex-wrap gap-1 mb-3 sticky top-14 z-20 bg-slate-100/95 backdrop-blur py-2 -mx-1 px-1 border-b border-slate-200" id="tabs"></nav>

  <section id="panel-bilgi" class="panel space-y-3"></section>
  <section id="panel-tur" class="panel hidden space-y-3"></section>
  <section id="panel-sinif" class="panel hidden space-y-3"></section>
  <section id="panel-soru" class="panel hidden space-y-3"></section>
  <section id="panel-not" class="panel hidden space-y-3"></section>
  <section id="panel-rapor" class="panel hidden space-y-3"></section>
  <section id="panel-yedek" class="panel hidden space-y-3"></section>
</main>

<script>
(function () {
  const LS_KEY = "eco_sinav_analiz_v2";
  const API_SINIF = (id) => "/api/sinav-analiz/sinif/" + id;
  const API_MUFREDAT = "/api/curriculum/drive-kazanimlari";
  const API_KAYITLAR = "/api/sinav-analiz/kayitlar";
  const API_KAYDET = "/api/sinav-analiz/kaydet";
  const API_KAYIT = (id) => "/api/sinav-analiz/kayit/" + id;
  const API_KAYIT_SIL = (id) => "/api/sinav-analiz/kayit/" + id + "/sil";
  const SINIFLAR = {{ siniflar | default([]) | tojson }};
  const DERSLER = {{ dersler | default([]) | tojson }};
  const DEFAULT_OKUL = {{ (okul_adi or "Erenler Cumhuriyet Ortaokulu") | tojson }};
  const DEFAULT_MUDUR = "ADEM AKGÜL";
  const OGRETMEN_ADI = {{ (ogretmen_adi or "") | tojson }};

  const TUR_RAPOR_BASLIK = {
    yazili: "YAZILI SINAV ÖĞRENME ÇIKTISI ANALİZİ",
    dinleme: "DİNLEME SINAVI ÖĞRENME ÇIKTISI ANALİZİ",
    konusma: "KONUŞMA SINAVI ÖĞRENME ÇIKTISI ANALİZİ",
  };

  const TAB_DEF = [
    { id: "bilgi", icon: "🏠", label: "Bilgi girişi" },
    { id: "tur", icon: "⚙️", label: "Analiz türü" },
    { id: "sinif", icon: "🏫", label: "Sınıf listesi" },
    { id: "soru", icon: "📝", label: "Öğrenme çıktıları" },
    { id: "not", icon: "🎓", label: "Öğrenci notları" },
    { id: "rapor", icon: "🖨️", label: "Rapor" },
    { id: "yedek", icon: "💾", label: "Veri / yedek" },
  ];

  const ANALIZ_LABEL = {
    genel: "1. Genel dersler analizi",
    tde: "2. TDE analizi",
    yabanci: "3. Yabancı dil",
    turkce: "4. Türkçe",
  };

  let curriculumCache = null;

  function uid(prefix) {
    return (prefix || "x") + "_" + Date.now().toString(36) + "_" + Math.random().toString(36).slice(2, 8);
  }

  function defaultState() {
    return {
      _v: 3,
      meta: {
        okulAdi: DEFAULT_OKUL,
        ders: DERSLER[0] || "",
        ogretmen: OGRETMEN_ADI,
        mudur: DEFAULT_MUDUR,
        sinavAdi: "2. Dönem 1. Yazılı",
        egitimYili: "2025-2026",
        analizTuru: "genel",
        sinifId: SINIFLAR[0] ? SINIFLAR[0].id : null,
        sinifAdi: SINIFLAR[0] ? SINIFLAR[0].sinif_adi : "",
        sinifMevcudu: "",
        sinavaKatilan: "",
        basariEsik: "50",
        zayifKazanimEsik: "60",
        degerlendirmeEk: (
          "Hata yapılan soruların ait olduğu öğrenme çıktılarının tekrarı için 2 ders saati süre ayrılmıştır. " +
          "Sınav soruları sınıfta çözülerek kağıtlar öğrencilere dağıtılmış ve hatalarını görmeleri sağlanmıştır. " +
          "Bu belirtilen konularla ilgili ödevlendirme yapılmıştır. Ayrıca her öğrencinin tek tek eksik öğrenme çıktısı veya " +
          "öğrenme çıktıları tespit edilerek \"Öğrenci Bazlı Sınav Analizi\" hazırlanıp bu rapora eklenmiştir."
        ),
      },
      ogrenciler: [],
      sorular: { yazili: [], dinleme: [], konusma: [] },
      notlar: {},
    };
  }

  let state = defaultState();
  let saveTid = null;
  let serverSaveTid = null;
  let activeTab = "bilgi";
  let currentKayitId = null;
  let serverKayitlar = [];
  let excelPasteOpen = true;
  let excelPasteText = "";
  let excelImportMessage = "";

  function mergeMetaDefaults() {
    const d = defaultState().meta;
    Object.keys(d).forEach((k) => {
      if (state.meta[k] === undefined || state.meta[k] === null) state.meta[k] = d[k];
    });
    state.meta.mudur = DEFAULT_MUDUR;
  }

  function normalizeState(nextState) {
    state = Object.assign(defaultState(), nextState || {});
    if (!state.meta || typeof state.meta !== "object") state.meta = {};
    if (!Array.isArray(state.ogrenciler)) state.ogrenciler = [];
    if (!state.sorular || typeof state.sorular !== "object") state.sorular = {};
    ["yazili", "dinleme", "konusma"].forEach((k) => {
      if (!Array.isArray(state.sorular[k])) state.sorular[k] = [];
      state.sorular[k] = state.sorular[k].map((q, idx) => {
        const item = q && typeof q === "object" ? q : {};
        if (!item.id) item.id = uid("q");
        const no = parseInt(item.no, 10);
        item.no = Number.isFinite(no) && no > 0 ? no : idx + 1;
        item.puan = Math.max(0, parseFloat(item.puan) || 0);
        item.metin = String(item.metin || "");
        return item;
      });
    });
    if (!state.notlar || typeof state.notlar !== "object") state.notlar = {};
    mergeMetaDefaults();
    state.ogrenciler.forEach((ogr) => {
      if (ogr.katilmadi == null) ogr.katilmadi = false;
    });
  }

  function loadState() {
    try {
      const storedServerId = parseInt(localStorage.getItem(LS_KEY + "_server_id") || "", 10);
      currentKayitId = Number.isFinite(storedServerId) && storedServerId > 0 ? storedServerId : null;
      const raw = localStorage.getItem(LS_KEY);
      if (!raw) {
        currentKayitId = null;
        localStorage.removeItem(LS_KEY + "_server_id");
        return;
      }
      const o = JSON.parse(raw);
      if (!o || typeof o !== "object") {
        currentKayitId = null;
        localStorage.removeItem(LS_KEY + "_server_id");
        return;
      }
      normalizeState(o);
    } catch (e) {
      console.warn(e);
      state = defaultState();
      currentKayitId = null;
      localStorage.removeItem(LS_KEY + "_server_id");
    }
  }

  function scheduleSave() {
    clearTimeout(saveTid);
    saveTid = setTimeout(() => {
      try {
        localStorage.setItem(LS_KEY, JSON.stringify(state));
        const hist = JSON.parse(localStorage.getItem(LS_KEY + "_hist") || "[]");
        hist.unshift({ t: new Date().toISOString(), sinav: state.meta.sinavAdi || "—" });
        localStorage.setItem(LS_KEY + "_hist", JSON.stringify(hist.slice(0, 12)));
        if (currentKayitId) {
          clearTimeout(serverSaveTid);
          serverSaveTid = setTimeout(() => sunucuyaKaydet(true), 1400);
        }
      } catch (e) {
        alert("Kaydedilemedi: " + e.message);
      }
    }, 350);
  }

  function kayitBaslik() {
    const m = state.meta || {};
    const parcalar = [m.sinifAdi, m.ders, m.sinavAdi, m.egitimYili]
      .map((p) => String(p || "").trim())
      .filter(Boolean);
    return parcalar.join(" - ") || "Adsız sınav analizi";
  }

  function updateKayitStatus() {
    const btn = document.getElementById("btn-sunucu-kaydet");
    if (btn) btn.textContent = currentKayitId ? "Güncelle" : "Kaydet";
  }

  async function sunucuyaKaydet(silent) {
    try {
      const r = await fetch(API_KAYDET, {
        method: "POST",
        credentials: "same-origin",
        headers: {
          "Content-Type": "application/json",
          "X-Requested-With": "XMLHttpRequest",
        },
        body: JSON.stringify({ id: currentKayitId, state }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.sebep || "Kayıt yapılamadı.");
      currentKayitId = Number(j.kayit.id);
      localStorage.setItem(LS_KEY + "_server_id", String(currentKayitId));
      updateKayitStatus();
      if (activeTab === "yedek") kayitlariYukle();
      if (!silent) alert("Sınav analizi kaydedildi.");
      return j;
    } catch (e) {
      if (silent) console.warn(e);
      else alert(e.message || String(e));
      return null;
    }
  }

  function kayitKarti(k) {
    const current = currentKayitId && Number(k.id) === Number(currentKayitId);
    const alt = [k.sinif_adi, k.ders, k.sinav_adi, k.egitim_yili].filter(Boolean).join(" · ");
    return `
      <div class="rounded-xl border ${current ? "border-emerald-300 bg-emerald-50" : "border-slate-200 bg-white"} p-3 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
        <div class="min-w-0">
          <div class="flex flex-wrap items-center gap-2">
            <h3 class="text-sm font-black text-slate-800 truncate">${esc(k.baslik || "Adsız sınav analizi")}</h3>
            ${current ? '<span class="rounded-full bg-emerald-700 px-2 py-0.5 text-[10px] font-black text-white">Açık</span>' : ""}
          </div>
          <p class="text-xs text-slate-500 mt-1">${esc(alt || "Bilgi girilmemiş")}</p>
          <p class="text-[11px] text-slate-400 mt-1">Son kayıt: ${esc(k.guncelleme || k.olusturma || "")}</p>
        </div>
        <div class="flex flex-wrap gap-2">
          <button type="button" data-load-kayit="${k.id}" class="rounded-lg bg-okul-800 text-white text-xs font-bold px-3 py-2">Aç</button>
          <button type="button" data-delete-kayit="${k.id}" class="rounded-lg border border-red-200 text-red-700 text-xs font-bold px-3 py-2">Sil</button>
        </div>
      </div>`;
  }

  async function kayitlariYukle() {
    const box = document.getElementById("sunucu-kayit-listesi");
    if (box) box.innerHTML = '<div class="rounded-xl border border-slate-200 bg-slate-50 p-3 text-xs text-slate-500">Kayıtlar yükleniyor...</div>';
    try {
      const r = await fetch(API_KAYITLAR, { credentials: "same-origin" });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.sebep || "Kayıtlar alınamadı.");
      serverKayitlar = Array.isArray(j.kayitlar) ? j.kayitlar : [];
      if (!box) return;
      box.innerHTML = serverKayitlar.length
        ? serverKayitlar.map(kayitKarti).join("")
        : '<div class="rounded-xl border border-dashed border-slate-300 bg-slate-50 p-4 text-sm text-slate-500">Henüz sunucuya kaydedilmiş sınav analizi yok.</div>';
      box.querySelectorAll("[data-load-kayit]").forEach((btn) => {
        btn.addEventListener("click", () => sunucuKaydiYukle(Number(btn.getAttribute("data-load-kayit"))));
      });
      box.querySelectorAll("[data-delete-kayit]").forEach((btn) => {
        btn.addEventListener("click", () => sunucuKaydiSil(Number(btn.getAttribute("data-delete-kayit"))));
      });
    } catch (e) {
      if (box) box.innerHTML = `<div class="rounded-xl border border-red-200 bg-red-50 p-3 text-xs text-red-700">${esc(e.message || String(e))}</div>`;
    }
  }

  async function sunucuKaydiYukle(id, silent) {
    if (!id) return;
    try {
      const r = await fetch(API_KAYIT(id), { credentials: "same-origin" });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.sebep || "Kayıt açılamadı.");
      normalizeState(j.state);
      currentKayitId = Number(j.kayit.id);
      localStorage.setItem(LS_KEY, JSON.stringify(state));
      localStorage.setItem(LS_KEY + "_server_id", String(currentKayitId));
      activeTab = "bilgi";
      renderTabs();
      showPanel();
      renderActivePanel();
      updateKayitStatus();
      if (!silent) alert("Kayıt açıldı.");
    } catch (e) {
      if (silent) console.warn(e);
      else alert(e.message || String(e));
    }
  }

  async function sunucuKaydiSil(id) {
    if (!id) return;
    if (!confirm("Bu sınav analizi sunucu kayıtlarından silinsin mi?")) return;
    try {
      const r = await fetch(API_KAYIT_SIL(id), {
        method: "DELETE",
        credentials: "same-origin",
        headers: { "X-Requested-With": "XMLHttpRequest" },
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || !j.ok) throw new Error(j.sebep || "Kayıt silinemedi.");
      if (Number(currentKayitId) === Number(id)) {
        currentKayitId = null;
        localStorage.removeItem(LS_KEY + "_server_id");
        updateKayitStatus();
      }
      await kayitlariYukle();
      alert("Kayıt silindi.");
    } catch (e) {
      alert(e.message || String(e));
    }
  }

  function studentKey(o) {
    if (o.dbId != null) return "id_" + o.dbId;
    return "m_" + (o.sira || 0) + "_" + String(o.adSoyad || "").slice(0, 12);
  }

  function ensureNotlar(key) {
    if (!state.notlar[key]) state.notlar[key] = {};
    return state.notlar[key];
  }

  function soruNo(q, idx) {
    const no = parseInt(q && q.no, 10);
    return Number.isFinite(no) && no > 0 ? no : idx + 1;
  }

  function flatQuestions() {
    const out = [];
    ["yazili", "dinleme", "konusma"].forEach((tur) => {
      (state.sorular[tur] || []).forEach((q, idx) => {
        out.push({ tur, q, idx, no: soruNo(q, idx), colId: tur[0] + "_" + q.id });
      });
    });
    return out;
  }

  function hesapDetay() {
    const fq = flatQuestions();
    const maxTop = fq.reduce((s, c) => s + c.q.puan, 0);
    const basEsik = parseFloat(state.meta.basariEsik) || 50;
    const zayifEsik = parseFloat(state.meta.zayifKazanimEsik) || 60;

    const katilmayan = state.ogrenciler.filter((o) => o.katilmadi).length;
    const mevcutAuto = state.ogrenciler.length;
    const mevcut = parseInt(state.meta.sinifMevcudu, 10) || mevcutAuto;

    const aktifOgr = state.ogrenciler.filter((o) => !o.katilmadi);
    const totListe = [];
    aktifOgr.forEach((o) => {
      const sk = studentKey(o);
      let tot = 0;
      let any = false;
      fq.forEach((c) => {
        const v = state.notlar[sk] && state.notlar[sk][c.colId];
        if (v != null && v !== "" && !isNaN(Number(v))) {
          tot += Number(v);
          any = true;
        }
      });
      totListe.push({ o, sk, tot, any });
    });

    let katSay = parseInt(state.meta.sinavaKatilan, 10);
    if (!katSay || katSay < 1) katSay = totListe.filter((x) => x.any).length || aktifOgr.length || 1;

    const puanlar = totListe.filter((x) => x.any).map((x) => x.tot);
    const ortPuan = puanlar.length ? puanlar.reduce((a, b) => a + b, 0) / puanlar.length : 0;
    const basarililar = totListe.filter((x) => x.any && x.tot >= basEsik).length;
    const basarisiz = Math.max(0, totListe.filter((x) => x.any).length - basarililar);
    const basariYuzde = katSay > 0 ? Math.round((basarililar / katSay) * 1000) / 10 : 0;

    let std = 0;
    if (puanlar.length > 1) {
      const m = ortPuan;
      const v = puanlar.reduce((s, t) => s + (t - m) * (t - m), 0) / (puanlar.length - 1);
      std = Math.sqrt(v);
    }

    const qStats = fq.map((c) => {
      const vals = [];
      aktifOgr.forEach((o) => {
        const sk = studentKey(o);
        const v = state.notlar[sk] && state.notlar[sk][c.colId];
        if (v != null && v !== "" && !isNaN(Number(v))) vals.push(Number(v));
      });
      const ort = vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
      const basariSoru = c.q.puan > 0 ? Math.round((ort / c.q.puan) * 1000) / 10 : 0;
      return Object.assign({}, c, { ort, basariSoru, n: vals.length });
    });

    const zayifListe = qStats.filter((q) => q.n > 0 && q.basariSoru < zayifEsik);

    const ogrenciZayif = state.ogrenciler.map((o) => {
      const sk = studentKey(o);
      if (o.katilmadi) return { o, sk, items: [], toplam: null };
      const items = [];
      fq.forEach((c) => {
        const max = c.q.puan;
        const v = state.notlar[sk] && state.notlar[sk][c.colId];
        const got = v != null && v !== "" && !isNaN(Number(v)) ? Number(v) : null;
        if (got === null || got < max) {
          items.push({
            soruEtiketi: `${TUR_RAPOR_BASLIK[c.tur] || c.tur} ${c.no}. soru`,
            metin: soruAnalizMetni(c.q),
            alinan: got,
            tamPuan: max,
          });
        }
      });
      let toplam = 0;
      fq.forEach((c) => {
        const v = state.notlar[sk] && state.notlar[sk][c.colId];
        if (v != null && v !== "" && !isNaN(Number(v))) toplam += Number(v);
      });
      return { o, sk, items, toplam: aktifOgr.includes(o) ? toplam : null };
    });

    const minP = puanlar.length ? Math.min(...puanlar) : 0;
    const maxP = puanlar.length ? Math.max(...puanlar) : 0;

    return {
      fq,
      maxTop,
      mevcut,
      katSay,
      katilmayan,
      ortPuan,
      basariYuzde,
      std,
      basEsik,
      zayifEsik,
      basarililar,
      basarisiz,
      qStats,
      zayifListe,
      ogrenciZayif,
      minP,
      maxP,
    };
  }

  function kisaMetin(s, n) {
    s = (s || "").trim();
    if (s.length <= n) return s;
    return s.slice(0, Math.max(0, n - 1)) + "…";
  }

  function soruAnalizMetni(q) {
    return String(q && q.metin ? q.metin : "").trim() || "(Tanımsız öğrenme çıktısı)";
  }

  function destekCalismaMetni(it) {
    const puanBilgisi = it.alinan == null ? "puan girilmediği" : `${it.alinan}/${it.tamPuan} puan aldığı`;
    return `${it.soruEtiketi} için beklenen öğrenme çıktısını tam gösteremediği (${puanBilgisi}) için öğrenciye konu tekrarı, örnek soru çözümü, pekiştirme ödevi ve kısa kontrol çalışması verilmiştir.`;
  }

  function esc(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;");
  }

  function escAttr(s) {
    return String(s ?? "")
      .replace(/&/g, "&amp;")
      .replace(/"/g, "&quot;");
  }

  function buildFormalRaporHtml() {
    const H = hesapDetay();
    const m = state.meta;
    const okulUst = String(m.okulAdi || "").toUpperCase();
    const turEtiket = {
      yazili: "YAZILI SINAV",
      dinleme: "DİNLEME",
      konusma: "KONUŞMA",
    };

    function notGirildiMi() {
      const aktif = state.ogrenciler.filter((o) => !o.katilmadi);
      const fq2 = flatQuestions();
      return aktif.some((o) => {
        const sk = studentKey(o);
        return fq2.some((c) => {
          const v = state.notlar[sk] && state.notlar[sk][c.colId];
          return v != null && v !== "" && !isNaN(Number(v));
        });
      });
    }
    const hasSoru = H.fq.length > 0;
    const hasNot = notGirildiMi();
    const enYuksekStr = hasSoru && hasNot ? String(H.maxP) : "—";
    const enDusukStr = hasSoru && hasNot ? String(H.minP) : "—";
    const istatHtml = `
      <tr><td>Sınıf Mevcudu</td><td>${H.mevcut}</td></tr>
      <tr><td>Sınava Katılan</td><td>${H.katSay}</td></tr>
      <tr><td>Ort. Puan</td><td>${hasSoru && hasNot ? H.ortPuan.toFixed(2) : "—"}</td></tr>
      <tr><td>Başarı %</td><td>${hasSoru ? "%" + H.basariYuzde : "—"}</td></tr>
      <tr><td>Std. Sapma</td><td>${hasSoru && hasNot ? (H.std ? H.std.toFixed(2) : "0.00") : "—"}</td></tr>
      <tr><td>Max. Puan</td><td>${enYuksekStr}</td></tr>
      <tr><td>Min. Puan</td><td>${enDusukStr}</td></tr>
      <tr><td>Sınav Üst Sınırı (Toplam)</td><td>${H.maxTop || "—"}</td></tr>
    `;

  function curriculumDersAdi(ders) {
    if (ders === "T.C. İnkılap Tarihi") return "T.C. İnkılap Tarihi ve Atatürkçülük";
    return ders || "";
  }

  function curriculumBloklar(ders) {
    const dersler = (curriculumCache && curriculumCache.dersler) || {};
    return ders ? (dersler[ders] || []) : [];
  }

  function curriculumKonuBol(baslik) {
    const parcalar = String(baslik || "").split(/\s*·\s*/).map((p) => p.trim()).filter(Boolean);
    if (parcalar.length >= 2) {
      return { tema: parcalar[0], icerik: parcalar.slice(1).join(" · ") };
    }
    const tek = parcalar[0] || String(baslik || "").trim();
    return { tema: tek, icerik: tek };
  }

  function curriculumKonular(ders, tema) {
    const satirlar = [];
    curriculumBloklar(ders).forEach((bl) => {
      (bl.konular || []).forEach((kon) => {
        const bolum = curriculumKonuBol(kon.baslik);
        if (tema && bolum.tema !== tema) return;
        satirlar.push({
          baslik: kon.baslik || "",
          konuTema: bolum.tema,
          konuIcerik: bolum.icerik,
          kaynakTema: bl.tema || "",
          ciktilar: kon.ciktilar || [],
        });
      });
    });
    return satirlar;
  }

  function notHucre(sk, colId, v) {
    const bag = ensureNotlar(sk);
    if (v === "" || v == null) delete bag[colId];

  function temizOgrNo(v) {
    return String(v ?? "")
      .trim()
      .replace(/\.0$/, "")
      .replace(/[^\dA-Za-z]/g, "")
      .toUpperCase();
  }

  function puanDegeri(v, max) {
    const raw = String(v ?? "").trim();
    if (!raw) return { empty: true };
    if (/^(g|k|kat[iı]lmad[iı]|gelmedi)$/i.test(raw)) return { absent: true };
    const cleaned = raw.replace(",", ".").replace(/[^\d.-]/g, "");
    if (!cleaned) return { empty: true };
    const n = Number(cleaned);
    if (!Number.isFinite(n)) return { invalid: true, raw };
    const ust = Number(max);
    const clipped = Number.isFinite(ust) && ust > 0 ? Math.min(Math.max(n, 0), ust) : Math.max(n, 0);
    return { value: clipped, clipped: clipped !== n };
  }

  function excelSatirHucreleri(line) {
    const text = String(line || "").trim();
    if (!text) return [];
    if (text.includes("\t")) return text.split("\t").map((x) => x.trim());
    if (text.includes(";")) return text.split(";").map((x) => x.trim());
    return text.split(/\s+/).map((x) => x.trim());
  }

  function ogrenciPuanOzeti(o, fq) {
    if (!o || o.katilmadi) return { total: 0, any: false, label: "G" };
    const sk = studentKey(o);
    let total = 0;
    let any = false;
    fq.forEach((c) => {
      const v = state.notlar[sk] && state.notlar[sk][c.colId];
      if (v !== "" && v != null && Number.isFinite(Number(v))) {
        total += Number(v);
        any = true;
      }
    });
    return { total, any, label: any ? String(Math.round(total * 100) / 100) : "G" };
  }

  function excelPuanlariniIsle(raw) {
    const fq = flatQuestions();
    const rows = String(raw || "").split(/\r?\n/).map((r) => r.trim()).filter(Boolean);
    if (!state.ogrenciler.length) {
      excelImportMessage = "Önce sınıf listesini yükleyin.";
      renderActivePanel();
      return;
    }
    if (!fq.length) {
      excelImportMessage = "Önce öğrenme çıktısı / soru kolonlarını oluşturun.";
      renderActivePanel();
      return;
    }
    if (!rows.length) {
      excelImportMessage = "Excel’den kopyaladığınız satırları kutuya yapıştırın.";
      renderActivePanel();
      return;
    }

    const ogrByNo = new Map();
    state.ogrenciler.forEach((o) => {
      const key = temizOgrNo(o.ogrNo);
      if (key) ogrByNo.set(key, o);
    });

    let matched = 0;
    let scoreCount = 0;
    let absentCount = 0;
    let clippedCount = 0;
    const missing = [];
    const invalid = [];

    rows.forEach((line, rowIdx) => {
      const cells = excelSatirHucreleri(line);
      if (!cells.length) return;
      let noKey = temizOgrNo(cells[0]);
      let ogr = ogrByNo.get(noKey);
      let noCellIndex = 0;
      if (!ogr && cells.length > 1) {
        const ikinciNo = temizOgrNo(cells[1]);
        const ikinciOgr = ogrByNo.get(ikinciNo);
        if (ikinciOgr) {
          noKey = ikinciNo;
          ogr = ikinciOgr;
          noCellIndex = 1;
        }
      }
      if (!ogr) {
        missing.push(cells[0] || `${rowIdx + 1}. satır`);
        return;
      }
      matched += 1;
      const sk = studentKey(ogr);
      const bag = ensureNotlar(sk);
      let absent = false;
      let scoreStart = noCellIndex + 1;
      if (fq.length && cells.length > scoreStart + 1) {
        const ilkAday = puanDegeri(cells[scoreStart], fq[0].q.puan);
        const sonrakiAday = puanDegeri(cells[scoreStart + 1], fq[0].q.puan);
        if (ilkAday.invalid && !sonrakiAday.invalid) scoreStart += 1;
      }
      fq.forEach((c, idx) => {
        const cell = cells[idx + scoreStart];
        const parsed = puanDegeri(cell, c.q.puan);
        if (parsed.absent) {
          absent = true;
          return;
        }
        if (parsed.empty || cell === undefined) return;
        if (parsed.invalid) {
          invalid.push(`${ogr.ogrNo} / S${idx + 1}: ${parsed.raw}`);
          return;
        }
        bag[c.colId] = String(parsed.value);
        scoreCount += 1;
        if (parsed.clipped) clippedCount += 1;
      });
      if (absent) {
        ogr.katilmadi = true;
        Object.keys(bag).forEach((k) => delete bag[k]);
        absentCount += 1;
      } else {
        ogr.katilmadi = false;
      }
    });
    state.meta.sinavaKatilan = String(state.ogrenciler.filter((o) => !o.katilmadi).length);

    excelImportMessage = [
      `${matched} öğrenci eşleşti`,
      `${scoreCount} puan işlendi`,
      absentCount ? `${absentCount} öğrenci G yapıldı` : "",
      clippedCount ? `${clippedCount} puan soru üst sınırına çekildi` : "",
      missing.length ? `Eşleşmeyen no: ${missing.slice(0, 8).join(", ")}${missing.length > 8 ? "..." : ""}` : "",
      invalid.length ? `Geçersiz değer: ${invalid.slice(0, 5).join(", ")}${invalid.length > 5 ? "..." : ""}` : "",
    ].filter(Boolean).join(" · ");
    scheduleSave();
    renderActivePanel();
  }

    const mfFilt = el.querySelector("#muf-filt");
    const mfOut = el.querySelector("#muf-sonuc");

    function mufredatDersleriDoldur() {
      if (!curriculumCache || !mfDers) return;
      const dersAdlari = Object.keys(curriculumCache.dersler || {}).sort();
      const hedefDers = mufredatSeciliDers || curriculumDersAdi(state.meta.ders);
      mufredatSeciliDers = dersAdlari.includes(hedefDers) ? hedefDers : (dersAdlari[0] || "");
      mfDers.innerHTML =
        `<option value="">— Ders seçin —</option>` +
        dersAdlari.map((d) => `<option value="${escAttr(d)}"${mufredatSeciliDers === d ? " selected" : ""}>${esc(d)}</option>`).join("");
    }

    function mufredatCiz() {
      if (!curriculumCache || !mfOut) return;
      mufredatDersleriDoldur();
      const ders = (mfDers && mfDers.value) || mufredatSeciliDers || "";
      const flt = (mufredatFilter || "").toLowerCase().trim();
      const sat = [];
      curriculumKonular(ders, "").forEach((kon) => {
          const kb = kon.baslik || "";
          (kon.ciktilar || []).forEach((c) => {
            const metin = (c || "").trim();
            if (!metin) return;
            const arama = metin.toLowerCase();
            if (flt && arama.indexOf(flt) === -1) return;
            sat.push({ metin });
          });
      });
      if (!ders) {
        mfOut.innerHTML = `<div class="p-2 text-slate-500">Ders seçin.</div>`;
        return;
      }
      if (!sat.length) {
        mfOut.innerHTML = `<div class="p-2 text-slate-500">Seçili ders veya filtre için öğrenme çıktısı bulunamadı.</div>`;
        return;
      }
      mfOut.innerHTML = sat
        .map(
          (r, i) =>
            `<div class="border-b border-slate-100 px-2 py-1.5 hover:bg-amber-50/80">
              <button type="button" class="text-left w-full" data-muf-pick="${i}">
                <span class="text-slate-800">${esc(r.metin)}</span>
              </button>
            </div>`
        )
        .join("");
      mfOut.querySelectorAll("[data-muf-pick]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const i = parseInt(btn.getAttribute("data-muf-pick"), 10);
          const row = sat[i];
          if (row) soruEkle(soruPanelTur, row.metin, 10, {});
        });
      });
    }

    if (mfDers) {
      mfDers.addEventListener("change", () => {
        mufredatSeciliDers = mfDers.value;
        mufredatCiz();
      });
    }
    if (mfFilt) {
      mfFilt.addEventListener("input", () => {
        mufredatFilter = mfFilt.value;
        mufredatCiz();
      });
    }

    if (!curriculumCache) {
      if (mfOut) mfOut.innerHTML = `<div class="p-2 text-slate-500">Öğrenme çıktıları yükleniyor...</div>`;
      fetchCurriculum()
        .then(() => {
          if (activeTab === "soru") renderActivePanel();
        })
        .catch((e) => {
          if (mfOut) mfOut.innerHTML = `<div class="p-2 text-red-700 bg-red-50">Öğrenme çıktıları yüklenemedi: ${esc(e.message || String(e))}</div>`;
        });
    } else if (mfDers) {
      mufredatCiz();
    }
  }

                <th class="border border-slate-700 bg-slate-800 px-3 py-3 text-white">Adı Soyadı</th>
                ${head}
                <th class="border border-slate-700 bg-slate-800 px-3 py-3 text-white">PUAN</th>
                <th class="border border-slate-700 bg-slate-800 px-3 py-3 text-white">Sil</th>
              </tr>
            </thead>
            <tbody>${body || `<tr><td colspan="${5 + fq.length}" class="p-5 text-center text-sm font-bold text-slate-500">Sınıf listesi boş. Sınıf seçip listeyi sistemden yükleyin.</td></tr>`}</tbody>
          </table>
        </div>
        <div class="mt-3 flex flex-wrap gap-2">
          <button type="button" id="btn-not-sinif-yukle" class="rounded-lg bg-okul-800 px-4 py-2 text-xs font-black text-white">Sistemden sınıfı yenile</button>
          <button type="button" id="btn-not-ogr-ekle" class="rounded-lg border border-slate-300 px-4 py-2 text-xs font-black text-slate-700">Satır ekle</button>
        </div>
      </div>`;

    el.querySelector("#btn-excel-ac")?.addEventListener("click", () => {
      excelPasteOpen = true;
      renderActivePanel();
    });
    el.querySelector("#btn-excel-kapat")?.addEventListener("click", () => {
      excelPasteOpen = false;
      renderActivePanel();
    });
    const ta = el.querySelector("#excel-puan-ta");
    if (ta) ta.addEventListener("input", () => { excelPasteText = ta.value; });
    el.querySelector("#btn-excel-isle")?.addEventListener("click", () => {
      excelPasteText = ta ? ta.value : excelPasteText;
      excelPuanlariniIsle(excelPasteText);
    });
    el.querySelector("#btn-not-sinif-yukle")?.addEventListener("click", () => sinifListesiYukle());
    el.querySelector("#btn-not-ogr-ekle")?.addEventListener("click", () => ogrenciSatirEkle());
    const sinifSel = el.querySelector("#not-sinif-select");
    if (sinifSel) {
      sinifSel.addEventListener("change", async () => {
        state.meta.sinifId = parseInt(sinifSel.value, 10) || null;
        syncSinifFromSelect();
        await sinifListesiYukle();
      });
    }
    el.querySelectorAll("[data-not-o]").forEach((inp) => {
      const i = parseInt(inp.getAttribute("data-not-o"), 10);
      const k = inp.getAttribute("data-not-k");
      inp.addEventListener("input", () => patchOgrenci(i, k, inp.value));
    });
    el.querySelectorAll("[data-not-score]").forEach((inp) => {
      const upd = () => {
        const parsed = puanDegeri(inp.value, inp.getAttribute("data-not-max"));
        if (parsed.invalid || parsed.absent) return;
        notHucre(inp.getAttribute("data-not-score"), inp.getAttribute("data-not-col"), parsed.empty ? "" : String(parsed.value));
        renderActivePanel();
      };
      inp.addEventListener("change", upd);
      inp.addEventListener("blur", upd);
    });
    el.querySelectorAll("[data-not-del]").forEach((btn) => {
      btn.addEventListener("click", () => {
        if (!confirm("Bu öğrenci satırı silinsin mi?")) return;
        ogrenciSatirSil(parseInt(btn.getAttribute("data-not-del"), 10));
      });
    });
  }

  function renderRapor() {
    const el = document.getElementById("panel-rapor");
    const html = buildFormalRaporHtml();
    const blobUrl = URL.createObjectURL(new Blob([html], { type: "text/html;charset=utf-8" }));
    el.innerHTML = `
      <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm space-y-3">
        <div class="flex flex-wrap gap-2 items-center justify-between">
          <h2 class="text-sm font-black text-slate-800">Yazdırılabilir rapor</h2>
          <div class="flex flex-wrap gap-2">
            <button type="button" id="btn-print-rapor" class="rounded-xl bg-amber-700 text-white text-xs font-bold px-3 py-2">Yazdır / PDF</button>
            <a id="btn-rapor-indir" class="rounded-xl border border-slate-300 text-xs font-bold px-3 py-2 inline-flex items-center" href="${blobUrl}" download="sinav-analiz-raporu.html">HTML indir</a>
          </div>
        </div>
        <iframe id="rapor-ifr" class="w-full min-h-[520px] border border-slate-200 rounded-xl bg-white" title="Önizleme"></iframe>
      </div>`;
    const ifr = el.querySelector("#rapor-ifr");
    if (ifr) ifr.srcdoc = html;
    const pr = el.querySelector("#btn-print-rapor");
    if (pr) {
      pr.addEventListener("click", () => {
        const w = window.open("", "_blank");
        if (w) {
          w.document.write(html);
          w.document.close();
          w.focus();
          w.print();
        }
      });
    }
  }

  function renderYedek() {
    const el = document.getElementById("panel-yedek");
    el.innerHTML = `
      <div class="rounded-2xl border border-slate-200 bg-white p-4 shadow-sm space-y-3">
        <h2 class="text-sm font-black text-slate-800">Yedek / geri yükle</h2>
        <p class="text-xs text-slate-600">Veriler tarayıcıda (localStorage) saklanır. Aşağıdaki JSON’u kopyalayarak yedekleyebilirsiniz.</p>
        <textarea id="yedek-ta" class="w-full min-h-[200px] rounded-xl border border-slate-300 p-2 text-xs font-mono"></textarea>
        <div class="flex flex-wrap gap-2">
          <button type="button" id="btn-yedek-copy" class="rounded-xl bg-slate-800 text-white text-xs font-bold px-3 py-2">Panoya kopyala</button>
          <button type="button" id="btn-yedek-apply" class="rounded-xl border border-amber-600 text-amber-900 text-xs font-bold px-3 py-2">Metinden yükle</button>
          <button type="button" id="yedek-reset" class="rounded-xl border border-red-200 text-red-700 text-xs font-bold px-3 py-2">Sıfırla</button>
        </div>
      </div>`;
    const ta = el.querySelector("#yedek-ta");
    el.insertAdjacentHTML("afterbegin", `
      <div class="rounded-2xl border border-emerald-200 bg-gradient-to-br from-emerald-50 to-white p-4 shadow-sm space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <div>
            <h2 class="text-sm font-black text-slate-800">Sunucu kayıtları</h2>
            <p class="text-xs text-slate-600 mt-1">Analizleri öğretmen hesabınıza kaydedin; istediğiniz zaman açabilir veya silebilirsiniz.</p>
          </div>
          <button type="button" id="btn-server-save-panel" class="rounded-xl bg-emerald-700 text-white text-xs font-bold px-3 py-2">Bu analizi kaydet</button>
        </div>
        <div class="rounded-xl border border-emerald-100 bg-white/70 p-3 text-xs text-emerald-900">
          Aktif taslak: <b>${esc(kayitBaslik())}</b>${currentKayitId ? " · sunucuda kayıtlı" : " · henüz sunucuya kaydedilmedi"}
        </div>
        <div id="sunucu-kayit-listesi" class="space-y-2"></div>
      </div>
    `);
    el.querySelector("#btn-server-save-panel")?.addEventListener("click", () => sunucuyaKaydet(false));
    kayitlariYukle();
    if (ta) ta.value = JSON.stringify(state, null, 2);
    el.querySelector("#btn-yedek-copy")?.addEventListener("click", async () => {
      try {
        await navigator.clipboard.writeText(ta.value);
        alert("Kopyalandı.");
      } catch (e) {
        alert("Panoya kopyalanamadı.");
      }
    });
    el.querySelector("#btn-yedek-apply")?.addEventListener("click", () => {
      try {
        const o = JSON.parse(ta.value);
        if (!o || typeof o !== "object") throw new Error("Geçersiz");
        normalizeState(o);
        currentKayitId = null;
        localStorage.removeItem(LS_KEY + "_server_id");
        scheduleSave();
        renderTabs();
        showPanel();
        renderActivePanel();
        alert("Yüklendi.");
      } catch (e) {
        alert("JSON hatalı: " + (e.message || e));
      }
    });
    el.querySelector("#yedek-reset")?.addEventListener("click", () => {
      if (!confirm("Tüm sınav analizi verisi silinsin mi?")) return;
      localStorage.removeItem(LS_KEY);
      localStorage.removeItem(LS_KEY + "_server_id");
      currentKayitId = null;
      state = defaultState();
      curriculumCache = null;
      updateKayitStatus();
      renderTabs();
      showPanel();
      renderActivePanel();
    });
  }

  function renderActivePanel() {
    if (activeTab === "bilgi") renderBilgi();
    else if (activeTab === "tur") renderTur();
    else if (activeTab === "sinif") renderSinif();
    else if (activeTab === "soru") renderSoru();
    else if (activeTab === "not") renderNot();
    else if (activeTab === "rapor") renderRapor();
    else if (activeTab === "yedek") renderYedek();
  }

  loadState();
  renderTabs();
  showPanel();
  renderActivePanel();
  updateKayitStatus();
  fetchCurriculum()
    .then(() => {
      if (activeTab === "soru") renderActivePanel();
    })
    .catch((e) => console.warn(e));
  document.getElementById("btn-sunucu-kaydet")?.addEventListener("click", () => sunucuyaKaydet(false));
  document.getElementById("btn-kayitlar")?.addEventListener("click", () => {
    activeTab = "yedek";
    renderTabs();
    showPanel();
    renderActivePanel();
  });
  const baslangicKayitId = Number(new URLSearchParams(window.location.search).get("kayit") || 0);
  if (Number.isFinite(baslangicKayitId) && baslangicKayitId > 0) {
    sunucuKaydiYukle(baslangicKayitId, true);
  } else if (state.meta.sinifId && state.ogrenciler.length === 0) {
    sinifListesiYukle();
  }
})();
</script>
{% endblock %}
