{% for n in notlar %}<article class="vp-note {{ 'vp-note--warning' if n.tur == 'uyari' else ('vp-note--positive' if n.tur == 'olumlu' else 'vp-note--other') }}"><p class="vp-eyebrow">{{ 'Uyarı' if n.tur == 'uyari' else ('Olumlu davranış' if n.tur == 'olumlu' else 'Duyuru') }}</p><p>{{ n.not_metni }}</p><p class="vp-muted">{{ n.ogretmen }} · {{ (n.tarih or '')[:16] }}</p></article>{% else %}<p class="vp-muted">Henüz not yok.</p>{% endfor %}
