{% extends 'base.html' %}{% block title %}Ödevi düzenle{% endblock %}{% block body %}<main class="page-content"><h1>Ödevi düzenle</h1>{% for message in get_flashed_messages() %}<p class="app-notice" role="status">{{ message }}</p>{% endfor %}<form method="post" class="app-card app-filter"><input type="hidden" name="surum" value="{{ surum }}"><label>Başlık<input name="baslik" required maxlength="200" value="{{ odev.baslik }}"></label><label>Ders<input name="ders" maxlength="80" value="{{ odev.ders }}"></label><label>Son tarih<input type="date" name="son_tarih" required value="{{ odev.son_tarih }}"></label><label>Açıklama<textarea name="aciklama" maxlength="2000">{{ odev.aciklama }}</textarea></label><button class="app-primary">Değişiklikleri kaydet</button><a class="app-button" href="{{ url_for('islem_gecmisi') }}">Vazgeç</a></form></main>{% endblock %}
