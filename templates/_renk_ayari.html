<button type="button" id="renk-ayari-ac" data-renk-ac class="renk-ayari-fab" aria-label="Renk ayarı">Renk</button>
<div id="renk-ayari" class="renk-ayari" hidden>
  <div class="renk-ayari-kutu" role="dialog" aria-labelledby="renk-ayari-baslik">
    <p class="renk-ayari-ust">Görünüm</p>
    <h2 id="renk-ayari-baslik">Renk seçin</h2>
    <p class="renk-ayari-alt">Seçim bu cihazda kalır. Öğretmen ve veli ekranı aynı paleti kullanır.</p>
    <div class="renk-secenekler">
      <button type="button" data-renk-secenek="leylak">
        <span class="renk-onizleme" style="background:linear-gradient(135deg,#d7c4f6,#f3c6e0,#ffe1c4)"></span>
        Leylak
      </button>
      <button type="button" data-renk-secenek="pembe">
        <span class="renk-onizleme" style="background:linear-gradient(135deg,#f7b7d4,#ffc4d8,#ffe1c4)"></span>
        Pembe
      </button>
      <button type="button" data-renk-secenek="seftali">
        <span class="renk-onizleme" style="background:linear-gradient(135deg,#ffd6a8,#ffc4b0,#f7b7d4)"></span>
        Şeftali
      </button>
      <button type="button" data-renk-secenek="nane">
        <span class="renk-onizleme" style="background:linear-gradient(135deg,#bde9d8,#c9f0e4,#b8d8ff)"></span>
        Nane
      </button>
      <button type="button" data-renk-secenek="gok">
        <span class="renk-onizleme" style="background:linear-gradient(135deg,#b8d8ff,#c9b4f0,#bde9d8)"></span>
        Gök
      </button>
      <button type="button" data-renk-secenek="limon">
        <span class="renk-onizleme" style="background:linear-gradient(135deg,#ffe08a,#ffe9b8,#bde9d8)"></span>
        Limon
      </button>
    </div>
    <button type="button" data-renk-kapat class="renk-ayari-kapat">Kapat</button>
  </div>
</div>
