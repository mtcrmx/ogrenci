<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>2D Voleybol Motoru (Pro)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --volley-blue:#2563eb;
      --volley-red:#ef4444;
      --volley-gold:#f59e0b;
      --volley-ink:#0f172a;
      --volley-panel:rgba(15,23,42,.84);
    }
    html, body {
      width: 100%;
      height: 100%;
      overscroll-behavior: none;
    }
    body {
      background:
        radial-gradient(circle at 20% 10%, rgba(37,99,235,.28), transparent 34%),
        radial-gradient(circle at 78% 14%, rgba(239,68,68,.22), transparent 32%),
        linear-gradient(180deg,#07111f 0%,#0b1220 46%,#111827 100%);
      color: #fff; margin: 0; overflow: hidden; font-family: 'Segoe UI', system-ui, sans-serif;
    }
    @keyframes pulse-banner {
      0%,100% { opacity:1; transform:translateX(-50%) scale(1); }
      50%      { opacity:.85; transform:translateX(-50%) scale(1.04); }
    }
    #audio-banner {
      position:fixed; bottom:14px; left:50%; transform:translateX(-50%);
      background:rgba(16,185,129,0.93); color:#fff; padding:9px 22px;
      border-radius:22px; font-weight:800; font-size:13px; cursor:pointer;
      z-index:9999; box-shadow:0 4px 18px rgba(0,0,0,.55);
      animation:pulse-banner 1.3s ease-in-out infinite;
      display:none;
    }
    #game-container {
      position: relative;
      width: 100dvw;
      height: 100dvh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #header {
      min-height: 88px;
      background: linear-gradient(90deg,rgba(15,23,42,.98),rgba(17,24,39,.96));
      display: grid;
      grid-template-columns: minmax(0,1fr) minmax(160px,240px) minmax(0,1fr);
      gap: 14px;
      align-items: center;
      padding: 10px 18px;
      border-bottom: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 12px 38px rgba(0,0,0,.38);
      z-index: 4;
    }
    .team-card {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border: 1px solid rgba(255,255,255,.13);
      background: rgba(255,255,255,.055);
      border-radius: 8px;
    }
    .team-card.away { flex-direction: row-reverse; text-align: right; }
    .team-logo {
      width: 38px; height: 38px; flex: 0 0 auto;
      display: grid; place-items: center;
      border-radius: 50%;
      font-weight: 950;
      color: white;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,.28), 0 8px 20px rgba(0,0,0,.28);
    }
    .team-card.home .team-logo { background: linear-gradient(145deg,#60a5fa,#1d4ed8); }
    .team-card.away .team-logo { background: linear-gradient(145deg,#fb7185,#b91c1c); }
    .team-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; font-weight: 900; }
    .team-meta { font-size: 10px; text-transform: uppercase; letter-spacing: .14em; color: rgba(226,232,240,.68); font-weight: 800; }
    #score-board {
      align-self: stretch;
      display: grid;
      place-items: center;
      text-align: center;
      background: linear-gradient(180deg,rgba(2,6,23,.96),rgba(15,23,42,.92));
      border: 1px solid rgba(245,158,11,.45);
      border-radius: 8px;
      box-shadow: inset 0 0 28px rgba(245,158,11,.08);
      font-weight: 950;
    }
    .set-line { color: var(--volley-gold); font-size: 11px; letter-spacing: .18em; }
    .score-line { font-size: 30px; line-height: 1; letter-spacing: .04em; }
    #canvas-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px),
        linear-gradient(180deg,rgba(255,255,255,.03) 1px,transparent 1px),
        radial-gradient(circle at 50% 45%,rgba(245,158,11,.18),transparent 46%);
      background-size: 48px 48px,48px 48px,100% 100%;
      overflow: hidden;
    }
    canvas {
      display: block;
      background: #d97706;
      border: 1px solid rgba(255,255,255,.32);
      border-radius: 8px;
      box-shadow: 0 24px 60px rgba(0,0,0,.52), 0 0 0 12px rgba(245,158,11,.18);
      max-width: 100%;
      max-height: 100%;
    }
    #volley-panel {
      position: absolute;
      left: 16px;
      top: 16px;
      z-index: 3;
      width: min(230px, calc(100vw - 32px));
      background: var(--volley-panel);
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 8px;
      padding: 10px;
      box-shadow: 0 18px 45px rgba(0,0,0,.36);
      backdrop-filter: blur(10px);
      pointer-events: none;
    }
    .stat-row { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; font-size: 12px; margin-bottom: 7px; color: rgba(226,232,240,.78); }
    .stat-value { color: #fff; font-weight: 900; }
    #volley-ticker { display: grid; gap: 5px; margin-top: 7px; }
    .ticker-item {
      font-size: 11px;
      line-height: 1.3;
      color: rgba(255,255,255,.84);
      border-top: 1px solid rgba(255,255,255,.08);
      padding-top: 5px;
      overflow-wrap: anywhere;
    }
    #event-overlay {
      position: absolute; top: 30%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(2,6,23,0.84); color: #fff; padding: 14px 24px; border-radius: 8px;
      border: 1px solid rgba(255,255,255,.18);
      font-weight: 950; font-size: 18px; opacity: 0; transition: opacity 0.3s; pointer-events: none;
      text-align: center; box-shadow: 0 18px 44px rgba(0,0,0,.45);
    }
    @media (max-width: 760px) {
      #header {
        display: flex;
        gap: 6px;
        padding: 6px;
        height: 62px;
        min-height: 62px;
        align-items: stretch;
      }
      #score-board {
        order: 2;
        flex: 0 0 88px;
        min-width: 0;
      }
      .team-card {
        flex: 1 1 0;
        min-width: 0;
        overflow: hidden;
        gap: 5px;
        min-height: 0;
        padding: 5px;
      }
      .team-card.home { order: 1; }
      .team-card.away { order: 3; }
      .team-logo { width: 25px; height: 25px; font-size: 11px; }
      .team-name { font-size: 10px; line-height: 1.05; }
      .team-meta { display: none; }
      .set-line { font-size: 8px; letter-spacing: .08em; }
      .score-line { font-size: 20px; letter-spacing: 0; }
      #canvas-wrap { padding: 4px; }
      canvas {
        border-radius: 7px;
        box-shadow: 0 14px 42px rgba(0,0,0,.48), 0 0 0 5px rgba(245,158,11,.14);
      }
      #volley-panel {
        left: 6px;
        top: 6px;
        width: 112px;
        padding: 6px;
        border-radius: 8px;
        background: rgba(15,23,42,.72);
      }
      .stat-row {
        grid-template-columns: 1fr auto;
        gap: 5px;
        font-size: 10px;
        margin-bottom: 4px;
      }
      #volley-ticker { display: none; }
      #event-overlay {
        top: auto;
        bottom: 8px;
        width: calc(100dvw - 16px);
        padding: 8px 10px;
        font-size: 12px;
      }
      #audio-banner {
        bottom: 8px;
        width: min(300px, calc(100dvw - 16px));
        padding: 8px 12px;
        text-align: center;
      }
    }
    @media (max-width: 380px), (max-height: 620px) {
      #header {
        gap: 4px;
        padding: 5px;
        height: 56px;
        min-height: 56px;
      }
      #score-board { flex-basis: 76px; }
      .team-card { padding: 4px; }
      .team-logo { width: 22px; height: 22px; font-size: 10px; }
      .team-name { font-size: 9px; }
      .set-line { font-size: 7px; }
      .score-line { font-size: 18px; }
      #volley-panel { width: 96px; }
      .stat-row { font-size: 9px; margin-bottom: 3px; }
    }
  </style>
</head>
<body>
<!-- Ses kilidi bannerı -->
<div id="audio-banner" onclick="sesAc()">🔊 Sesi açmak için tıkla</div>

<div id="game-container">
  <div id="header">
    <div class="team-card home">
      <div class="team-logo" id="team1-badge">B</div>
      <div style="min-width:0">
        <div class="team-meta">Ev Sahibi</div>
        <div class="team-name" id="team1-name">Bizim Sınıf</div>
      </div>
    </div>
    <div id="score-board">
       <div class="set-line">SET <span id="set1">0</span> - <span id="set2">0</span></div>
       <div class="score-line"><span id="score1">0</span> - <span id="score2">0</span></div>
    </div>
    <div class="team-card away">
      <div class="team-logo" id="team2-badge">R</div>
      <div style="min-width:0">
        <div class="team-meta">Rakip</div>
        <div class="team-name" id="team2-name">Rakip Sınıf</div>
      </div>
    </div>
    <button onclick="window.close()" class="absolute right-4 top-14 mt-2 px-3 py-1 bg-red-600 rounded text-xs font-bold hover:bg-red-500 z-50 hidden" id="close-btn">Kapat</button>
  </div>
  <div id="canvas-wrap">
    <div id="volley-panel">
      <div class="stat-row"><span>Ralli</span><span class="stat-value" id="hud-rally">0</span></div>
      <div class="stat-row"><span>Temas</span><span class="stat-value" id="hud-touch">0/3</span></div>
      <div class="stat-row"><span>Faz</span><span class="stat-value" id="hud-phase">Servis</span></div>
      <div id="volley-ticker"></div>
    </div>
    <canvas id="pitch"></canvas>
    <div id="event-overlay">Maç Başlıyor!</div>
  </div>
</div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const rakip_id = urlParams.get('rakip_id');

// ========== SES SİSTEMİ (en üste taşındı — tüm fonksiyonlar kullanabilsin) ==========
const volSes = {
    ortam: new Audio("{{ url_for('static', filename='audio/ortamstadium.mp3') }}"),
    top:   new Audio("{{ url_for('static', filename='audio/topavurus.mp3') }}"),
};
volSes.ortam.loop   = true;
volSes.ortam.volume = 0.22;
volSes.top.volume   = 0.55;
let volSesAcik    = false;
let lastTopSesiAt = 0;

function sesAc() {
    volSesAcik = true;
    const banner = document.getElementById('audio-banner');
    if (banner) banner.style.display = 'none';
    volSes.ortam.play().catch(() => {});
}

function topVurusSesi() {
    if (!volSesAcik) return;
    const now = performance.now();
    if (now - lastTopSesiAt < 110) return;
    lastTopSesiAt = now;
    const klon = volSes.top.cloneNode();
    klon.volume = 0.45 + Math.random() * 0.3;
    klon.play().catch(() => {});
}

// Ortam sesi kesilmez — 3sn kontrol
setInterval(() => {
    if (volSesAcik && volSes.ortam.paused) {
        volSes.ortam.play().catch(() => {});
    }
}, 3000);

// Sayfa yüklenince otomatik aç — başarısız olursa banner göster
volSes.ortam.play().then(() => {
    volSesAcik = true;
}).catch(() => {
    const banner = document.getElementById('audio-banner');
    if (banner) banner.style.display = 'block';
});

// Herhangi bir etkileşimde sesi aç
['pointerdown', 'keydown', 'touchstart'].forEach(ev => {
    window.addEventListener(ev, () => { if (!volSesAcik) sesAc(); }, { once: true, passive: true });
});
// ==========================================================================

const FPS = 60;
const GAME_WIDTH = 450;
const GAME_HEIGHT = 900;
const NET_Y = GAME_HEIGHT / 2;

// === PHYSICS CONSTANTS ===
const GRAVITY = 0.18;           // 9.81 m/s² scaled (~0.18 px/frame²)
const AIR_DRAG = 0.003;         // Air resistance coefficient
const FLOOR_RESTITUTION = 0.85; // 15% energy loss on floor bounce
const NET_RESTITUTION = 0.4;    // 60% energy loss on net collision
const NET_TOP_Z = 18;           // Net height in Z units
const ATTACK_LINE_DISTANCE = 150;
const HIGH_ATTACK_Z = NET_TOP_Z + 7;

let isPlaying = false;
let score1 = 0, score2 = 0;
let set1 = 0, set2 = 0;
let stateMachine = "SERVIS"; // SERVIS, PLAYING, POINT_CELEBRATION, MATCH_END
let serverTeam = null;

const canvas = document.getElementById('pitch');
const ctx = canvas.getContext('2d');
canvas.width = GAME_WIDTH;
canvas.height = GAME_HEIGHT;

function resizeCanvas() {
    const wrap = document.getElementById('canvas-wrap');
    if (!wrap || !wrap.clientWidth || !wrap.clientHeight) return;
    const ratio = Math.max(0.1, Math.min(wrap.clientWidth / GAME_WIDTH, wrap.clientHeight / GAME_HEIGHT) * 0.985);
    canvas.style.width = (GAME_WIDTH * ratio) + 'px';
    canvas.style.height = (GAME_HEIGHT * ratio) + 'px';
}
window.addEventListener('resize', resizeCanvas);
window.addEventListener('orientationchange', () => setTimeout(resizeCanvas, 80));
resizeCanvas();

let team1 = null;
let team2 = null;
let players = [];
let ball = { x: GAME_WIDTH/2, y: GAME_HEIGHT/2, z: 0, vx: 0, vy: 0, vz: 0,
    spinX: 0, spinY: 0, // Magnus spin components
    owner: null, lastTouchedBy: null, lastTeamTouched: null, serveFlight: false };
let teamTouches = 0;
let goalTimer = 0;
let eventTimeout = null;
let servisOyuncuIndex = 0; // rotates each set
let lastNetSide = null; // track net crossing properly
let volleyTicks = 0;
let rallyTicks = 0;
let volleyTickerItems = [];
let lastVolleyPhase = "";

function showEvent(msg, duration=2000) {
    const el = document.getElementById('event-overlay');
    el.innerHTML = msg;
    el.style.opacity = 1;
    pushVolleyTicker(String(msg).replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, ""));
    clearTimeout(eventTimeout);
    if(duration > 0) eventTimeout = setTimeout(() => el.style.opacity = 0, duration);
}

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const normalize = (dx, dy) => {
    const len = Math.hypot(dx, dy);
    if (len === 0) return {x:0, y:0};
    return {x: dx/len, y: dy/len};
};

function clampVolleyStat(value, fallback = 55) {
    const n = Number.isFinite(value) ? value : fallback;
    return Math.max(1, Math.min(100, n));
}

function normalizeMorale(value) {
    const n = Number.isFinite(Number(value)) ? Number(value) : 50;
    return Math.max(0, Math.min(100, n));
}

function moraleVolleyStat(value, morale) {
    return clampVolleyStat(Math.round(clampVolleyStat(value, 55) + (normalizeMorale(morale) - 50) * 0.34));
}

function moraleMistakeFactor(p) {
    return Math.max(0.72, Math.min(1.55, 1 + (50 - normalizeMorale(p?.moral)) / 95));
}

function moraleConfidenceFactor(p) {
    return Math.max(0.84, Math.min(1.14, 1 + (normalizeMorale(p?.moral) - 50) / 360));
}

function makeVolleyBrain(oz, ovr, role, moral = 50) {
    const base = clampVolleyStat(ovr, 55);
    const hiz = clampVolleyStat(oz.hiz, base);
    const sut = clampVolleyStat(oz.sut, base);
    const pas = clampVolleyStat(oz.pas, base);
    const defans = clampVolleyStat(oz.defans, base);
    const r = String(role || "").toLocaleLowerCase('tr-TR');
    const liberoBoost = r.includes("libero") ? 8 : 0;
    const setterBoost = r.includes("pas") || r.includes("setter") ? 8 : 0;
    const mindBoost = (normalizeMorale(moral) - 50) * 0.18;
    return {
        receive: clampVolleyStat(Math.round(defans * 0.42 + pas * 0.24 + hiz * 0.16 + base * 0.16 + liberoBoost + mindBoost * 0.65)),
        set: clampVolleyStat(Math.round(pas * 0.58 + base * 0.24 + hiz * 0.08 + setterBoost + mindBoost)),
        attack: clampVolleyStat(Math.round(sut * 0.58 + hiz * 0.18 + base * 0.2 + mindBoost * 0.8)),
        block: clampVolleyStat(Math.round(defans * 0.48 + hiz * 0.18 + base * 0.2 + mindBoost * 0.55)),
        decisions: clampVolleyStat(Math.round(pas * 0.38 + defans * 0.22 + base * 0.3 + mindBoost)),
    };
}

function teamInitial(name, fallback) {
    const clean = String(name || fallback || "").trim();
    return (clean.match(/[A-Za-zÇĞİÖŞÜçğıöşü0-9]/) || [fallback || "?"])[0].toLocaleUpperCase('tr-TR');
}

function pushVolleyTicker(text) {
    const ticker = document.getElementById('volley-ticker');
    if (!ticker || !text) return;
    volleyTickerItems.unshift(text);
    volleyTickerItems = volleyTickerItems.slice(0, 4);
    ticker.innerHTML = volleyTickerItems.map(item => `<div class="ticker-item">${escapeHtml(item)}</div>`).join('');
}

function escapeHtml(text) {
    return String(text).replace(/[&<>"']/g, ch => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[ch]);
}

function updateVolleyHud() {
    const rally = document.getElementById('hud-rally');
    const touch = document.getElementById('hud-touch');
    const phase = document.getElementById('hud-phase');
    if (rally) rally.textContent = String(Math.floor(rallyTicks / FPS));
    if (touch) touch.textContent = `${Math.max(0, teamTouches)}/3`;
    if (phase) {
        const text = stateMachine === "SERVIS" ? "Servis"
            : stateMachine === "POINT_CELEBRATION" ? "Sayı"
            : ball.serveFlight ? "Servis karşılama"
            : teamTouches === 1 ? "Manşet sonrası"
            : teamTouches === 2 ? "Hücum seti"
            : "Ralli";
        if (text !== lastVolleyPhase) {
            lastVolleyPhase = text;
            phase.textContent = text;
        }
    }
}

function clampPointToTeamCourt(team, x, y, buffer = 18) {
    const minY = team.side === 1 ? NET_Y + buffer : buffer;
    const maxY = team.side === 1 ? GAME_HEIGHT - buffer : NET_Y - buffer;
    return {
        x: Math.max(buffer, Math.min(GAME_WIDTH - buffer, x)),
        y: Math.max(minY, Math.min(maxY, y)),
    };
}

function clampPlayerToOwnCourt(p, buffer = 15) {
    const pos = clampPointToTeamCourt(p.team, p.x, p.y, buffer);
    p.x = pos.x;
    p.y = pos.y;
}

function teamOnSide(side) {
    return team1.side === side ? team1 : team2;
}

function teamForBallY(y) {
    return y > NET_Y ? teamOnSide(1) : teamOnSide(2);
}

function ballOnTeamSide(team, y) {
    return team.side === 1 ? y > NET_Y : y < NET_Y;
}

function ballMovingTowardTeam(team) {
    return team.side === 1 ? ball.vy > 0 : ball.vy < 0;
}

function attackLineY(team) {
    return team.side === 1 ? NET_Y + ATTACK_LINE_DISTANCE : NET_Y - ATTACK_LINE_DISTANCE;
}

function isFrontAttackZone(team, y, buffer = 0) {
    return team.side === 1 ? y <= attackLineY(team) - buffer : y >= attackLineY(team) + buffer;
}

function legalBackRowAttackY(team, buffer = 26) {
    return team.side === 1 ? attackLineY(team) + buffer : attackLineY(team) - buffer;
}

function legalSpikeContactTarget(p) {
    if (!p) {
        return {x: GAME_WIDTH / 2, y: NET_Y};
    }
    if (p.currentRow !== 'back' && !p.isLibero) {
        return clampPointToTeamCourt(p.team, p.x, p.y, 24);
    }
    const laneX = Number.isFinite(p.baseX) ? p.baseX : p.x;
    return clampPointToTeamCourt(p.team, laneX, legalBackRowAttackY(p.team), 24);
}

function predictBallLanding() {
    let predX = ball.x;
    let predY = ball.y;
    let predZ = ball.z;
    let predVz = ball.vz;
    let predTime = 0;
    while (predTime < 150) {
        predVz -= GRAVITY;
        predX += ball.vx * (1 - AIR_DRAG * 0.5);
        predY += ball.vy * (1 - AIR_DRAG * 0.5);
        predZ += predVz;
        predTime++;
        if (predZ <= 0) break;
    }
    return { x: predX, y: predY, time: predTime };
}

function chooseReceiver(team, target) {
    let best = null;
    let bestScore = Infinity;
    players.forEach(p => {
        if (p.team !== team) return;
        // Çift vuruş kuralı: son topa vuran oyuncu receiver olamaz
        if (p === ball.lastTouchedBy) return;
        const receiveSkill = p.brain?.receive || p.ozellikler.defans || p.ovr || 55;
        let score = dist(p, target) * 0.82;
        score -= receiveSkill * 0.38;
        if (p.isLibero) score -= 28;
        if (p.currentRow === 'back') score -= 16;
        if (Math.abs(target.y - NET_Y) < 100 && p.currentRow === 'front') score -= 10;
        if (p.actionCooldown > 0) score += 32;
        if (score < bestScore) {
            bestScore = score;
            best = p;
        }
    });
    // Fallback: eğer herkes lastTouchedBy ise (1 kişilik takım gibi uç durum)
    // normal seçime dön
    if (!best) {
        players.forEach(p => {
            if (p.team !== team) return;
            const score = dist(p, target) + (p.actionCooldown > 0 ? 35 : 0);
            if (score < bestScore) { bestScore = score; best = p; }
        });
    }
    return best;
}

function chooseSetter(team, avoidPlayer) {
    let best = null;
    let bestScore = -Infinity;
    const idealY = team.side === 1 ? NET_Y + 74 : NET_Y - 74;
    players.forEach(p => {
        if (p.team !== team || p === avoidPlayer || p === ball.lastTouchedBy) return;
        const setSkill = p.brain?.set || p.ozellikler.pas || p.ovr || 55;
        let score = setSkill * 1.1 - Math.abs(p.y - idealY) * 0.18 - Math.abs(p.x - GAME_WIDTH * 0.52) * 0.08;
        if (p.currentRow === 'front') score += 18;
        if (p.isLibero) score -= 20;
        if (p.actionCooldown > 0) score -= 24;
        if (score > bestScore) { bestScore = score; best = p; }
    });
    return best || players.find(p => p.team === team && p !== avoidPlayer) || avoidPlayer;
}

function chooseSpiker(team, setter) {
    let best = null;
    let bestScore = -Infinity;
    players.forEach(p => {
        if (p.team !== team || p === setter || p.isLibero) return;
        const attack = p.brain?.attack || p.ozellikler.sut || p.ovr || 55;
        const frontRow = p.currentRow === 'front';
        const frontZoneRisk = !frontRow && isFrontAttackZone(p.team, p.y, 18);
        const contactTarget = legalSpikeContactTarget(p);
        let score = attack * 1.15 - Math.abs(contactTarget.y - NET_Y) * 0.11;
        if (frontRow) score += 34;
        else score -= 18;
        if (frontZoneRisk) score -= 44;
        if (Math.abs(p.x - GAME_WIDTH / 2) > 82) score += 8;
        if (p.actionCooldown > 0) score -= 28;
        if (score > bestScore) { bestScore = score; best = p; }
    });
    return best || players.find(p => p.team === team && p !== setter && !p.isLibero && p.currentRow === 'front') || players.find(p => p.team === team && p !== setter && !p.isLibero) || setter;
}

function chooseAttackLanding(p) {
    const attackTop = p.team.side === 1;
    const yMin = attackTop ? 38 : NET_Y + 58;
    const yMax = attackTop ? NET_Y - 58 : GAME_HEIGHT - 38;
    const deepY = attackTop ? yMin + (yMax - yMin) * 0.28 : yMin + (yMax - yMin) * 0.72;
    const shortY = attackTop ? yMin + (yMax - yMin) * 0.72 : yMin + (yMax - yMin) * 0.28;
    const candidates = [
        {x: 42, y: deepY, label: "çizgi"},
        {x: GAME_WIDTH - 42, y: deepY, label: "çizgi"},
        {x: GAME_WIDTH * 0.5, y: shortY, label: "plase"},
        {x: p.x < GAME_WIDTH / 2 ? GAME_WIDTH - 62 : 62, y: deepY, label: "çapraz"},
        {x: Math.max(44, Math.min(GAME_WIDTH - 44, p.x + (Math.random() * 120 - 60))), y: (deepY + shortY) / 2, label: "boş alan"},
    ];
    let best = candidates[0];
    let bestScore = -Infinity;
    candidates.forEach(c => {
        let nearest = 260;
        players.forEach(opp => {
            if (opp.team === p.team) return;
            nearest = Math.min(nearest, Math.hypot(opp.x - c.x, opp.y - c.y));
        });
        let score = nearest;
        score += Math.abs(c.x - GAME_WIDTH / 2) * 0.12;
        if (c.label === "çapraz") score += (p.brain?.decisions || 55) * 0.25;
        if (c.label === "plase" && (p.brain?.attack || 55) > 76) score += 18;
        if (score > bestScore) { bestScore = score; best = c; }
    });
    return clampPointToTeamCourt(p.team === team1 ? team2 : team1, best.x, best.y, 24);
}

function coverageTarget(p, receivePlan) {
    const pressure = p.currentRow === 'front' ? 0.18 : 0.12;
    let targetX = p.baseX + (receivePlan.x - p.baseX) * pressure;
    let targetY = p.baseY + (receivePlan.y - p.baseY) * pressure;

    if (dist({x: targetX, y: targetY}, receivePlan) < 55) {
        targetX += targetX < receivePlan.x ? -42 : 42;
        targetY += p.team.side === 1 ? 26 : -26;
    }

    return clampPointToTeamCourt(p.team, targetX, targetY, 22);
}

function separatePlayers() {
    for (let pass = 0; pass < 2; pass++) {
        for (let i = 0; i < players.length; i++) {
            for (let j = i + 1; j < players.length; j++) {
                const a = players[i];
                const b = players[j];
                if (a.team !== b.team) continue;
                let dx = b.x - a.x;
                let dy = b.y - a.y;
                let d = Math.hypot(dx, dy);
                const minGap = 28;
                if (d >= minGap) continue;
                if (d < 0.01) {
                    const angle = (i + j + pass) * 1.9;
                    dx = Math.cos(angle);
                    dy = Math.sin(angle);
                    d = 1;
                }
                const overlap = minGap - d;
                const nx = dx / d;
                const ny = dy / d;
                a.x -= nx * overlap * 0.5;
                a.y -= ny * overlap * 0.5;
                b.x += nx * overlap * 0.5;
                b.y += ny * overlap * 0.5;
                clampPlayerToOwnCourt(a);
                clampPlayerToOwnCourt(b);
            }
        }
    }
}

    team1 = { name: data.bizim_takim.ad, color: '#3b82f6', dirY: -1, defendY: GAME_HEIGHT, side: 1 };

function addPlayer(p, team, mirror) {
    let tx = (p.baseX / 100) * GAME_WIDTH;
    let ty = (p.baseY / 100) * GAME_HEIGHT;
    if (mirror) { tx = GAME_WIDTH - tx; ty = GAME_HEIGHT - ty; }
    const roleText = String(p.rol || "").toLocaleLowerCase('tr-TR');
    let isLibero = roleText.includes('libero');
    const moral = normalizeMorale(p.moral);
    const rawOzellikler = p.ozellikler ? { ...p.ozellikler } : {hiz: p.ovr, sut: p.ovr, pas: p.ovr, defans: p.ovr, kaleci: p.ovr};
    const baseOzellikler = {
        hiz: moraleVolleyStat(rawOzellikler.hiz, moral),
        sut: moraleVolleyStat(rawOzellikler.sut, moral),
        pas: moraleVolleyStat(rawOzellikler.pas, moral),
        defans: moraleVolleyStat(rawOzellikler.defans, moral),
        kaleci: moraleVolleyStat(rawOzellikler.kaleci, moral),
    };
    const baseOvr = moraleVolleyStat(p.ovr, moral);
    players.push({
        id: p.id, ad: p.ad, numara: p.numara, ovr: baseOvr, team: team, rol: p.rol || "",
        ozellikler: { ...baseOzellikler },
        brain: makeVolleyBrain(baseOzellikler, baseOvr, p.rol || "", moral),
        baseX: tx, baseY: ty, x: tx, y: ty, vx: 0, vy: 0,
        actionCooldown: 0,
        moral: moral,
        olumluTik: Number(p.olumlu_tik || 0),
        olumsuzTik: Number(p.olumsuz_tik || 0),
        isLibero: isLibero
    });
}

const VOLLEYBALL_ZONES = [
    {x: 0.8, y: 0.7, row: 'back'},   // Zone 1: Back Right (Server)
    {x: 0.5, y: 0.7, row: 'back'},   // Zone 6: Back Center
    {x: 0.2, y: 0.7, row: 'back'},   // Zone 5: Back Left
    {x: 0.2, y: 0.3, row: 'front'},  // Zone 4: Front Left
    {x: 0.5, y: 0.3, row: 'front'},  // Zone 3: Front Center
    {x: 0.8, y: 0.3, row: 'front'}   // Zone 2: Front Right
];

function resetPositions() {
    [team1, team2].forEach(team => {
        const teamPlayers = players.filter(p => p.team === team);
        teamPlayers.forEach((p, i) => {
            // Calculate rotational position
            const rotIdx = team.rotationIndex || 0;
            const currentZoneIdx = (i + rotIdx) % 6;
            const zone = VOLLEYBALL_ZONES[currentZoneIdx];
            
            p.currentRow = zone.row; // 'front' or 'back'
            p.currentZone = currentZoneIdx; // 0 is Server (Zone 1)
            
            // Mirror X for opponent side to align correctly? 
            // Standard: Zone 1 is always back right from team's perspective.
            let px = zone.x;
            if (team.side === 2) px = 1 - px; // mirror X for top team so 'right' is their right
            
            p.baseX = px * GAME_WIDTH;
            p.baseY = team.side === 1 
                ? GAME_HEIGHT/2 + zone.y * (GAME_HEIGHT/2)
                : GAME_HEIGHT/2 - zone.y * (GAME_HEIGHT/2);
                
            p.x = p.baseX; p.y = p.baseY; 
            p.vx = 0; p.vy = 0; p.actionCooldown = 0;
        });
    });

    ball.vx = 0; ball.vy = 0; ball.vz = 0; ball.spinX = 0; ball.spinY = 0; ball.owner = null; ball.serveFlight = false;
    teamTouches = 0; ball.lastTeamTouched = null; rallyTicks = 0;
    
    if (stateMachine !== "MATCH_END") {
        stateMachine = "SERVIS";
        
        // Server is always the player in Zone 1 (currentZoneIdx === 0), but Libero cannot serve
        const servingTeamPlayers = players.filter(p => p.team === serverTeam);
        let server = servingTeamPlayers.find(p => p.currentZone === 0) || servingTeamPlayers[0];
        if (server.isLibero) {
            // Pick another player to serve instead of Libero
            server = servingTeamPlayers.find(p => p.currentZone === 1) || servingTeamPlayers[1];
        }
        
        // Move server to service line
        server.x = serverTeam.side === 1 ? GAME_WIDTH - 40 : 40;
        server.y = serverTeam.side === 1 ? GAME_HEIGHT - 20 : 20;
        clampPlayerToOwnCourt(server, 12);
        ball.x = server.x; ball.y = server.y; ball.z = 10;
        ball.owner = server;
        server.actionCooldown = 60; // delay
        lastNetSide = serverTeam;
        updateVolleyHud();
    }
}

function givePoint(team, reason) {
    stateMachine = "POINT_CELEBRATION";
    goalTimer = 120;
    showEvent(reason + "<br>Sayı: " + team.name, 2000);
    updateVolleyHud();
    // Ortam sesi zaten çalıyor; ek bir sayı sesi yok
    
    if (team === team1) score1++; else score2++;
    document.getElementById('score1').textContent = score1;
    document.getElementById('score2').textContent = score2;
    
    // Rotation: only rotate if we won the serve back (Side-out)
    if (serverTeam !== team) {
        team.rotationIndex = ((team.rotationIndex || 0) + 1) % 6;
    }
    serverTeam = team;
    
    // Check set win (Set 5 is up to 15, others up to 25. Must win by 2)
    let pointsToWin = (set1 + set2 === 4) ? 15 : 25;
    
    if ((score1 >= pointsToWin || score2 >= pointsToWin) && Math.abs(score1 - score2) >= 2) {
        if (score1 > score2) set1++; else set2++;
        document.getElementById('set1').textContent = set1;
        document.getElementById('set2').textContent = set2;
        score1 = 0; score2 = 0;
        document.getElementById('score1').textContent = score1;
        document.getElementById('score2').textContent = score2;
        
        if (set1 === 3 || set2 === 3) {
            stateMachine = "MATCH_END";
            showEvent(`MAÇ BİTTİ!<br>Kazanan: ${set1===3 ? team1.name : team2.name}`, -1);
            autoSubmit();
        } else {
            showEvent(`SET BİTTİ!<br>${team.name} Seti Kazandı!`, 3000);
            goalTimer = 180;
            // Switch sides
            [team1.side, team2.side] = [team2.side, team1.side];
        }
    }
}

function autoSubmit() {
    document.getElementById('close-btn').style.display = 'block';
    if(window.opener && !window.opener.closed) {
        const form = window.opener.document.querySelector('form[action*="voleybol"]') || window.opener.document.forms[1];
        if (form) {
            const in1 = form.querySelector('input[name="skor1"]');
            const in2 = form.querySelector('input[name="skor2"]');
            if(in1) in1.value = set1;
            if(in2) in2.value = set2;
            showEvent("Sonuç öğretmene başarıyla gönderildi!", -1);
            form.submit();
        }
    }
}

function update() {
    if (!isPlaying || stateMachine === "MATCH_END") return;
    volleyTicks++;
    if (stateMachine === "PLAYING") rallyTicks++;
    if (volleyTicks % 12 === 0) updateVolleyHud();

    if (stateMachine === "POINT_CELEBRATION") {
        goalTimer--;
        if (goalTimer <= 0) resetPositions();
        return;
    }

    if (stateMachine === "SERVIS") {
        if (ball.owner) {
            let p = ball.owner;
            if (p.actionCooldown > 0) { p.actionCooldown--; return; }
            
            // Servis normalde rakip sahaya düşer; düşük ihtimalle file veya aut olur.
            const serveSkill = p.brain?.attack || p.ozellikler.sut || p.ovr || 55;
            const errMargin = ((100 - serveSkill) / 100) * 0.58 * moraleMistakeFactor(p);
            const faultRoll = Math.random();
            const serveFaultChance = Math.max(0.012, Math.min(0.095, 0.046 + (50 - normalizeMorale(p.moral)) / 1200 - (serveSkill - 55) / 2500));
            const netFaultLimit = serveFaultChance * 0.52;
            const serveFault = faultRoll < netFaultLimit ? "net" : (faultRoll < serveFaultChance ? "out" : null);
            const errX = (Math.random() * 42 - 21) * errMargin;
            const errY = (Math.random() * 34 - 17) * errMargin;
            const courtMargin = 70;
            const targetTop = p.team.side === 1;
            let gX = Math.max(courtMargin, Math.min(GAME_WIDTH - courtMargin,
                courtMargin + Math.random() * (GAME_WIDTH - courtMargin * 2) + errX));
            let gY = targetTop
                ? Math.max(90, Math.min(NET_Y - 95, 150 + Math.random() * 165 + errY))
                : Math.max(NET_Y + 95, Math.min(GAME_HEIGHT - 90, GAME_HEIGHT - 315 + Math.random() * 165 + errY));
            let travelFrames = 68 + Math.random() * 8 - serveSkill / 45;

            if (serveFault === "out") {
                const outX = Math.random() < 0.5 ? -35 : GAME_WIDTH + 35;
                gX = Math.random() < 0.45 ? outX : gX;
                gY = targetTop ? 45 + Math.random() * 35 : GAME_HEIGHT - 80 + Math.random() * 35;
                travelFrames = 68 + Math.random() * 8;
            } else if (serveFault === "net") {
                gX = GAME_WIDTH / 2 + (Math.random() * 160 - 80);
                gY = NET_Y + (targetTop ? -8 : 8);
                travelFrames = Math.max(38, Math.min(48, Math.abs(gY - p.y) / 10));
            }

            ball.vx = (gX - p.x) / travelFrames;
            ball.vy = (gY - p.y) / travelFrames;
            ball.vz = serveFault === "net"
                ? 4.15 + Math.random() * 0.25
                : Math.max(6.1, ((0.5 * GRAVITY * travelFrames * travelFrames) - ball.z) / travelFrames);
            // Magnus spin: float serve vs jump serve
            ball.spinX = serveFault ? 0 : (Math.random() - 0.5) * 0.035 * (1 - errMargin);
            ball.spinY = serveFault ? 0 : (Math.random() - 0.5) * 0.02 * (1 - errMargin);
            
            ball.owner = null;
            ball.lastTouchedBy = null; // Reset so server can receive return
            ball.lastTeamTouched = p.team;
            ball.serveFlight = true;
            lastNetSide = p.team;
            teamTouches = 0;
            rallyTicks = 0;
            stateMachine = "PLAYING";
            showEvent("Servis!", 600);
        }
        return;
    }

    // ========== ADVANCED BALL PHYSICS ==========
    // Gravity (9.81 m/s² scaled to game units: ~0.18 px/frame²)
    ball.vz -= GRAVITY;
    
    // Air drag (proportional to speed²)
    const speed2D = Math.hypot(ball.vx, ball.vy);
    if (speed2D > 0.1) {
        const dragCoeff = ball.serveFlight ? AIR_DRAG * 0.16 : AIR_DRAG;
        const dragForce = dragCoeff * speed2D * speed2D;
        const dragRatio = Math.max(0, 1 - dragForce / speed2D);
        ball.vx *= dragRatio;
        ball.vy *= dragRatio;
    }
    // Vertical air drag
    if (Math.abs(ball.vz) > 0.1) {
        const verticalDrag = ball.serveFlight ? AIR_DRAG * 0.08 : AIR_DRAG;
        ball.vz *= (1 - verticalDrag * Math.abs(ball.vz) * 0.3);
    }
    
    // Magnus Effect (spin curves the ball in air)
    if (ball.z > 0) {
        ball.vx += (ball.spinX || 0);
        ball.vy += (ball.spinY || 0);
        // Spin decays over time
        ball.spinX = (ball.spinX || 0) * 0.98;
        ball.spinY = (ball.spinY || 0) * 0.98;
    }
    
    // Apply velocity
    ball.x += ball.vx;
    ball.y += ball.vy;
    ball.z += ball.vz;
    
    // ========== FLOOR COLLISION (with bounce) ==========
    if (ball.z <= 0) {
        ball.z = 0;
        ball.serveFlight = false;
        const isOut = ball.x < 0 || ball.x > GAME_WIDTH || ball.y < 0 || ball.y > GAME_HEIGHT;
        
        if (isOut) {
            givePoint(ball.lastTeamTouched === team1 ? team2 : team1, "Top Dışarıda! (Aut)");
        } else {
            const hitSide = teamForBallY(ball.y);
            givePoint(hitSide === team1 ? team2 : team1, "Top Yerde!");
        }
        return;
    }
    
    // ========== NET COLLISION (elastic barrier) ==========
    const NET_HEIGHT = 18; // net top edge in z
    const prevY = ball.y - ball.vy;
    
    // Check if ball crossed net line this frame
    if ((prevY < NET_Y && ball.y >= NET_Y) || (prevY > NET_Y && ball.y <= NET_Y)) {
        if (ball.z < NET_HEIGHT) {
            // Ball hit the net!
            ball.vy = -ball.vy * NET_RESTITUTION; // bounce back with energy loss
            ball.vx *= NET_RESTITUTION;
            ball.vz = Math.max(ball.vz, -1) - 0.5; // net pushes ball down slightly
            ball.y = prevY; // push back to previous side
            ball.serveFlight = false;
            ball.spinX = (ball.spinX || 0) * 0.3; // kill most spin
            ball.spinY = (ball.spinY || 0) * 0.3;
            showEvent("File!", 400);
        }
    }
    
    // ========== NET CROSSING TRACKING ==========
    const ballNetSide = teamForBallY(ball.y);
    if (lastNetSide && ballNetSide !== lastNetSide && ball.z >= NET_HEIGHT) {
        teamTouches = 0;
        lastNetSide = ballNetSide;
        ball.lastTouchedBy = null; // Reset double-hit tracking on net crossing
    }

    // ========== PLAYER AI + HITBOX SYSTEM ==========
    const receiveTeam = teamForBallY(ball.y);
    const receiveTeamLocked = ball.serveFlight && receiveTeam === ball.lastTeamTouched;
    let receivePlan = null;
    if (ball.z > 0 && !receiveTeamLocked) {
        const predicted = predictBallLanding();
        const plannedTarget = clampPointToTeamCourt(receiveTeam, predicted.x, predicted.y, 22);
        const receiver = chooseReceiver(receiveTeam, plannedTarget);
        if (receiver) {
            receivePlan = {
                team: receiveTeam,
                player: receiver,
                x: plannedTarget.x,
                y: plannedTarget.y,
                time: predicted.time,
            };
        }
    }
    let contactResolvedThisFrame = false;

    players.forEach(p => {
        if (p.actionCooldown > 0) p.actionCooldown--;
        
        let targetX = p.baseX;
        let targetY = p.baseY;
        
        const ballOnMySide = ballOnTeamSide(p.team, ball.y);
        const servingTeamLocked = ball.serveFlight && p.team === ball.lastTeamTouched;
        
        // Movement AI: one clear receiver goes to the ball, teammates cover space.
        if (receivePlan && receivePlan.team === p.team && ballOnMySide && ball.z > 0 && !servingTeamLocked) {
            if (receivePlan.player === p) {
                targetX = receivePlan.x;
                targetY = receivePlan.y;
            } else {
                const cover = coverageTarget(p, receivePlan);
                targetX = cover.x;
                targetY = cover.y;
            }
        }
        
        // Movement physics
        const moveDir = normalize(targetX - p.x, targetY - p.y);
        const d = dist(p, {x:targetX, y:targetY});
        if (d > 5) {
            const speedMult = 0.55 + (p.ozellikler.hiz / 100) * 8.6; // daha seri ayak hareketi
            p.vx = moveDir.x * speedMult;
            p.vy = moveDir.y * speedMult;
        } else {
            p.vx *= 0.4; p.vy *= 0.4;
        }
        p.x += p.vx; p.y += p.vy;
        
        // Court boundaries (players can't cross net)
        clampPlayerToOwnCourt(p);
        
        // ========== HITBOX & CONTACT DETECTION ==========
        const HITBOX_RADIUS = 40; // Top karşılama daha güvenilir
        const hitDist = dist(p, ball);
        const zOK = ball.z > 0 && ball.z < 58; // Daha yüksekten top çıkarabilirler
        const nearNet = Math.abs(p.y - NET_Y) < 80;
        const isBlockAttempt = nearNet && ball.vz < 0 && ball.z > 12 && ballMovingTowardTeam(p.team);
        // Çift vuruş önlemi: son topa vuran oyuncu hitbox'ı tetikleyemez
        const isLastToucher = (p === ball.lastTouchedBy);
        const canPlayThisBall = !isLastToucher &&
            (!receivePlan || receivePlan.player === p || isBlockAttempt);
        
        if (!contactResolvedThisFrame && canPlayThisBall && ballOnMySide && !servingTeamLocked && zOK && hitDist < HITBOX_RADIUS && p.actionCooldown <= 0) {
            // Double-hit burada artık asla oluşmaz (yukarıdaki isLastToucher kontrolü sayesinde)
            // === RULE: 4th touch ===
            if (ball.lastTeamTouched === p.team && teamTouches >= 3) {
                contactResolvedThisFrame = true;
                givePoint(p.team === team1 ? team2 : team1, "4 Vuruş Hatası!");
                return;
            }
            
            ball.lastTouchedBy = p;
            ball.lastTeamTouched = p.team;
            ball.serveFlight = false;
            teamTouches++;
            p.actionCooldown = 25;
            
            // Check if opponent is near net for BLOCK
            const isBlock = isBlockAttempt;
            
            if (isBlock && p.ozellikler.defans > 30) {
                // RULE: Libero cannot block
                if (p.isLibero) {
                    contactResolvedThisFrame = true;
                    givePoint(p.team === team1 ? team2 : team1, "Libero Blok Hatası!");
                    return;
                }
                // === BLOCK: reverse velocity ===
                showEvent("BLOK! 🖐️", 600);
                topVurusSesi();
                const blockPower = 0.58 + ((p.brain?.block || p.ozellikler.defans) / 220);
                ball.vx = -ball.vx * blockPower + (Math.random() - 0.5) * 2;
                ball.vy = -ball.vy * blockPower;
                ball.vz = Math.abs(ball.vz) * 0.3 + 2;
                ball.spinX = 0; ball.spinY = 0;
                teamTouches--; // blocks don't count as team touch (FIVB rule)
                
            } else if (teamTouches === 1) {
                // === MANŞET (Dig/Bump): absorb speed, redirect up ===
                const receiveSkill = p.brain?.receive || p.ozellikler.defans || p.ovr || 55;
                const errMargin = ((100 - receiveSkill) / 100) * 0.68 * moraleMistakeFactor(p);
                showEvent(receiveSkill > 76 ? "Temiz manşet!" : "Manşet!", 400);
                topVurusSesi();
                const setter = chooseSetter(p.team, p);
                
                const errX = (Math.random() * 52 - 26) * errMargin;
                const errY = (Math.random() * 52 - 26) * errMargin;
                const tgt = {x: setter.x + errX, y: setter.y + errY};
                const tgtDist = dist(p, tgt);
                const bDir = normalize(tgt.x - p.x, tgt.y - p.y);
                
                // Manşet sends high to the setter
                ball.vz = 10.5 + receiveSkill / 55 + Math.random() * 1.5;
                const airT = (ball.vz / GRAVITY) * 2;
                // Artık absorbed ile çarpmıyoruz, pas doğrudan hedefe ulaşacak güce sahip olacak
                const pw = Math.max(2.25, tgtDist / airT);
                ball.vx = bDir.x * pw;
                ball.vy = bDir.y * pw;
                ball.spinX = (Math.random() - 0.5) * 0.05; // minimal spin
                ball.spinY = (Math.random() - 0.5) * 0.05;
                
            } else if (teamTouches === 2) {
                // === PARMAK PAS (Finger Set): precise placement ===
                const setSkill = p.brain?.set || p.ozellikler.pas || p.ovr || 55;
                const errMargin = ((100 - setSkill) / 100) * 0.48 * moraleMistakeFactor(p);
                showEvent(setSkill > 76 ? "Akıllı pas!" : "Parmak Pas! 🤲", 400);
                topVurusSesi();
                const spiker = chooseSpiker(p.team, p);
                const spikeTarget = legalSpikeContactTarget(spiker);
                
                // Parmak pas = very precise, low error
                const errX = (Math.random() * 42 - 21) * errMargin;
                const errY = (Math.random() * 42 - 21) * errMargin;
                const tgt = {x: spikeTarget.x + errX, y: spikeTarget.y + errY};
                const tgtDist = dist(p, tgt);
                const bDir = normalize(tgt.x - p.x, tgt.y - p.y);
                
                // Set goes high and precise
                ball.vz = 10.7 + setSkill / 58 + Math.random() * 1.4;
                const airT = (ball.vz / GRAVITY) * 2;
                const pw = Math.max(1.8, tgtDist / airT);
                ball.vx = bDir.x * pw;
                ball.vy = bDir.y * pw;
                ball.spinX = 0; ball.spinY = 0; // clean set
                
            } else {
                // === SMAÇ (Spike): high velocity + topspin ===
                // RULE: Back row attack violation (including Libero from anywhere)
                if (ball.z >= HIGH_ATTACK_Z) {
                    if (p.isLibero) {
                        contactResolvedThisFrame = true;
                        givePoint(p.team === team1 ? team2 : team1, "Libero Hücum İhlali!");
                        return;
                    }
                    if (p.currentRow === 'back' && isFrontAttackZone(p.team, p.y, 12)) {
                        contactResolvedThisFrame = true;
                        givePoint(p.team === team1 ? team2 : team1, "Arka Hat Hücum İhlali (3 Metre)!");
                        return;
                    }
                }
                
                const attackSkill = p.brain?.attack || p.ozellikler.sut || p.ovr || 55;
                showEvent(attackSkill > 78 ? "Sert smaç! 💥" : "SMAÇ! 💥", 600);
                topVurusSesi();
                const sutErr = ((100 - attackSkill) / 100) * Math.max(0.36, 1 - (p.brain?.decisions || 55) / 180) * moraleMistakeFactor(p);
                const landing = chooseAttackLanding(p);
                const errX = (Math.random() * 54 - 27) * sutErr;
                const errY = (Math.random() * 54 - 27) * sutErr;
                const tX = Math.max(8, Math.min(GAME_WIDTH - 8, landing.x + errX));
                const tY = Math.max(8, Math.min(GAME_HEIGHT - 8, landing.y + errY));
                
                const bDir = normalize(tX - p.x, tY - p.y);
                const tgtDist = dist(p, {x: tX, y: tY});
                
                // Spike: flat trajectory, fast
                ball.vz = 2.4 + attackSkill / 90 + Math.random() * 1.9;
                const airT = (ball.vz / GRAVITY) * 2;
                const pw = Math.max(4.6, (tgtDist / airT) * 1.12) * moraleConfidenceFactor(p);
                ball.vx = bDir.x * pw;
                ball.vy = bDir.y * pw;
                
                // Topspin (Magnus): ball curves downward
                ball.spinX = (Math.random() - 0.5) * 0.2;
                ball.spinY = (p.team.side === 1 ? -0.15 : 0.15) * (1 - sutErr); // topspin toward opponent
            }
            contactResolvedThisFrame = true;
        }
    });
    separatePlayers();
}

function draw() {
    ctx.clearRect(0,0,GAME_WIDTH,GAME_HEIGHT);

    const freeZone = ctx.createLinearGradient(0, 0, 0, GAME_HEIGHT);
    freeZone.addColorStop(0, '#1e40af');
    freeZone.addColorStop(0.5, '#2563eb');
    freeZone.addColorStop(1, '#1d4ed8');
    ctx.fillStyle = freeZone;
    ctx.fillRect(0, 0, GAME_WIDTH, GAME_HEIGHT);

    const margin = 22;
    const courtGrad = ctx.createLinearGradient(0, margin, 0, GAME_HEIGHT - margin);
    courtGrad.addColorStop(0, '#f59e0b');
    courtGrad.addColorStop(0.5, '#d97706');
    courtGrad.addColorStop(1, '#f59e0b');
    ctx.fillStyle = courtGrad;
    ctx.fillRect(margin, margin, GAME_WIDTH - margin * 2, GAME_HEIGHT - margin * 2);

    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(margin, NET_Y - 150, GAME_WIDTH - margin * 2, 150);
    ctx.fillRect(margin, NET_Y, GAME_WIDTH - margin * 2, 150);

    ctx.strokeStyle = 'rgba(120,53,15,.22)';
    ctx.lineWidth = 1;
    for (let y = margin + 18; y < GAME_HEIGHT - margin; y += 34) {
        ctx.beginPath();
        ctx.moveTo(margin, y);
        ctx.lineTo(GAME_WIDTH - margin, y);
        ctx.stroke();
    }

    ctx.strokeStyle = '#fff7ed';
    ctx.lineWidth = 3;
    ctx.strokeRect(margin, margin, GAME_WIDTH - margin * 2, GAME_HEIGHT - margin * 2);

    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.moveTo(margin, NET_Y); ctx.lineTo(GAME_WIDTH - margin, NET_Y); ctx.stroke();

    ctx.lineWidth = 2;
    ctx.setLineDash([12, 8]);
    ctx.beginPath(); ctx.moveTo(margin, NET_Y - 150); ctx.lineTo(GAME_WIDTH - margin, NET_Y - 150); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(margin, NET_Y + 150); ctx.lineTo(GAME_WIDTH - margin, NET_Y + 150); ctx.stroke();
    ctx.setLineDash([]);

    const netY = GAME_HEIGHT / 2;
    ctx.fillStyle = '#0f172a';
    ctx.fillRect(4, netY - 13, 8, 26);
    ctx.fillRect(GAME_WIDTH - 12, netY - 13, 8, 26);
    ctx.strokeStyle = 'rgba(15,23,42,.48)';
    ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(8, netY + 3); ctx.lineTo(GAME_WIDTH - 8, netY + 3); ctx.stroke();
    ctx.strokeStyle = '#f8fafc';
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(8, netY); ctx.lineTo(GAME_WIDTH - 8, netY); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.45)';
    ctx.lineWidth = 1;
    for (let nx = 18; nx < GAME_WIDTH - 18; nx += 14) {
        ctx.beginPath(); ctx.moveTo(nx, netY - 9); ctx.lineTo(nx, netY + 9); ctx.stroke();
    }
    for (let ny = netY - 8; ny <= netY + 8; ny += 8) {
        ctx.beginPath(); ctx.moveTo(8, ny); ctx.lineTo(GAME_WIDTH - 8, ny); ctx.stroke();
    }

    players.forEach(p => {
        const primary = p.isLibero ? (p.team === team1 ? team2.color : team1.color) : p.team.color;
        const grad = ctx.createRadialGradient(p.x - 5, p.y - 7, 2, p.x, p.y, 16);
        grad.addColorStop(0, '#ffffff');
        grad.addColorStop(0.18, primary);
        grad.addColorStop(1, '#0f172a');

        ctx.fillStyle = 'rgba(2,6,23,.35)';
        ctx.beginPath(); ctx.ellipse(p.x, p.y + 9, 15, 6, 0, 0, Math.PI * 2); ctx.fill();

        ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
        ctx.fillStyle = grad;
        ctx.fill();
        ctx.strokeStyle = p.isLibero ? '#fbbf24' : '#f8fafc';
        ctx.lineWidth = p.isLibero ? 3 : 2;
        ctx.stroke();

        ctx.fillStyle = '#fff';
        ctx.font = '900 11px Segoe UI, sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(p.numara, p.x, p.y);

        const name = String(p.ad || '').slice(0, 8);
        ctx.font = '800 9px Segoe UI, sans-serif';
        ctx.fillStyle = 'rgba(15,23,42,.78)';
        ctx.fillRect(p.x - 22, p.y + 18, 44, 13);
        ctx.strokeStyle = 'rgba(255,255,255,.22)';
        ctx.lineWidth = 1;
        ctx.strokeRect(p.x - 22, p.y + 18, 44, 13);
        ctx.fillStyle = '#fff';
        ctx.fillText(name, p.x, p.y + 25);
    });

    const spinMag = Math.hypot(ball.spinX || 0, ball.spinY || 0);
    const speed = Math.hypot(ball.vx, ball.vy, ball.vz);
    if (ball.z > 0 && (spinMag > 0.02 || speed > 5.5)) {
        for (let t = 4; t >= 1; t--) {
            ctx.globalAlpha = 0.07 * (5 - t);
            const trailSize = Math.max(4, 8 + ball.z * 0.12 - t);
            ctx.beginPath();
            ctx.arc(ball.x - ball.vx * t * 1.7, ball.y - ball.vy * t * 1.7 - ball.z + ball.vz * t, trailSize, 0, Math.PI*2);
            ctx.fillStyle = speed > 8 ? '#fb7185' : '#fde68a';
            ctx.fill();
        }
        ctx.globalAlpha = 1;
    }

    const shadowOffset = ball.z * 0.45;
    const shadowSize = Math.max(4, 10 - ball.z * 0.09);
    ctx.fillStyle = 'rgba(15,23,42,0.38)';
    ctx.beginPath(); ctx.ellipse(ball.x, ball.y + shadowOffset, shadowSize * 1.25, shadowSize * 0.62, 0, 0, Math.PI*2); ctx.fill();

    const ballSize = Math.max(6, 8 + ball.z * 0.18);
    const ballDrawY = ball.y - ball.z;
    const ballGrad = ctx.createRadialGradient(ball.x - 3, ballDrawY - 4, 1, ball.x, ballDrawY, ballSize);
    ballGrad.addColorStop(0, '#ffffff');
    ballGrad.addColorStop(0.42, speed > 8 ? '#fb7185' : (speed > 4 ? '#fde047' : '#fef3c7'));
    ballGrad.addColorStop(1, '#1e3a8a');
    ctx.beginPath(); ctx.arc(ball.x, ballDrawY, ballSize, 0, Math.PI*2);
    ctx.fillStyle = ballGrad;
    ctx.fill();
    ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 1.6; ctx.stroke();

    if (spinMag > 0.02) {
        ctx.strokeStyle = 'rgba(255,255,255,.9)';
        ctx.lineWidth = 1.4;
        ctx.beginPath();
        ctx.moveTo(ball.x - ballSize * 0.45, ballDrawY);
        ctx.quadraticCurveTo(ball.x, ballDrawY - ballSize * 0.45, ball.x + ballSize * 0.45, ballDrawY);
        ctx.stroke();
    }
}

function gameLoop() {
    try {
        update();
        draw();
    } catch(e) { console.error(e); }
    requestAnimationFrame(gameLoop);
}

loadData();
</script>
