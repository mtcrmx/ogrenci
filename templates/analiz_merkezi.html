{% extends "base.html" %}
{% block title %}Analiz{% endblock %}

{% block body %}
<main class="px-4 py-6">
  <section class="mx-auto max-w-6xl space-y-5">
    <div class="flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
      <div>
        <p class="text-xs font-black uppercase tracking-widest text-rose-700">Analiz</p>
        <h1 class="mt-1 text-2xl font-black text-slate-950">Sınıf özeti</h1>
        <p class="mt-1 text-sm text-slate-600">Sınıf listesi ve sınav çıktıları.</p>
      </div>
      {% if siniflar %}
      <form method="GET" action="{{ url_for('analiz_merkezi') }}" class="flex items-center gap-2">
        <label class="text-xs font-bold text-slate-600">Sınıf
          <select name="sinif_id" onchange="this.form.submit()"
                  class="ml-1 rounded-xl border border-slate-300 bg-white px-3 py-2 text-sm font-bold text-slate-800">
            {% for s in siniflar %}
              <option value="{{ s.id }}" {% if secili_sinif_id == s.id %}selected{% endif %}>{{ s.sinif_adi }}</option>
            {% endfor %}
          </select>
        </label>
      </form>
      {% endif %}
    </div>

    <section class="grid grid-cols-2 gap-3">
      <div class="rounded-2xl border border-slate-200 bg-white p-4">
        <div class="text-[11px] font-black uppercase text-slate-500">Öğrenci</div>
        <div class="mt-1 text-2xl font-black text-slate-950">{{ ozet.ogrenci }}</div>
      </div>
      <a href="{{ url_for('haftalik_takip', sinif=secili_sinif_id) if secili_sinif_id else url_for('haftalik_takip') }}"
         class="rounded-2xl border border-emerald-200 bg-emerald-50 p-4">
        <div class="text-[11px] font-black uppercase text-emerald-800">Giriş</div>
        <div class="mt-1 text-lg font-black text-slate-950">Kitap ve ödev</div>
      </a>
    </section>

    <section class="rounded-2xl border border-slate-200 bg-white p-5">
      <h2 class="text-lg font-black text-slate-950">Sınav</h2>
      <a href="{{ url_for('ogretmen_sinav_analiz') }}"
         class="mt-3 inline-flex rounded-xl bg-amber-600 px-4 py-3 text-sm font-black text-white">Sınav analizi</a>
    </section>
  </section>
</main>
{% endblock %}
