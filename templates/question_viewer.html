<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }} · Sorular</title>
<style>body{margin:0;background:#edf1f5;color:#243448;font-family:system-ui,sans-serif}header{position:sticky;top:0;z-index:2;background:#fff;padding:12px 18px;border-bottom:1px solid #d9e1ea;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:16px;margin:0;overflow-wrap:anywhere}nav{display:flex;align-items:center;gap:12px;font-size:14px}a,button{background:#eef4f5;color:#24545c;border:1px solid #cddfe1;border-radius:9px;padding:8px 12px;text-decoration:none;font:inherit;cursor:pointer}main{padding:14px;overflow:auto}img{display:block;width:100%;max-width:1050px;height:auto;margin:auto;background:white;box-shadow:0 2px 14px #20334b18}main.zoom img{max-width:none;width:1500px}p{font-size:12px;text-align:center;color:#536476}a:focus-visible,button:focus-visible{outline:3px solid #6d4acb;outline-offset:3px}@media(max-width:500px){header{padding:10px}main{padding:6px}nav{gap:7px;font-size:12px}}</style></head>
<body><header><h1>{{ title }}</h1><nav aria-label="Belge sayfaları">{% if page>1 %}<a href="?page={{ page-1 }}" aria-label="Önceki sayfa">← Önceki</a>{% endif %}<span>Sayfa {{ page }} / {{ total }}</span>{% if page<total %}<a href="?page={{ page+1 }}" aria-label="Sonraki sayfa">Sonraki →</a>{% endif %}<button type="button" id="zoom" aria-pressed="false">Büyüt</button></nav></header>
<main id="paper"><img src="{{ image_url }}" alt="{{ title }} — {{ page }}. soru sayfası"></main><p>Sorular site içinde görüntülenir. Sayfalar arasında üstteki düğmelerle geçebilirsiniz.</p>
<script>document.getElementById('zoom').addEventListener('click',function(){const active=document.getElementById('paper').classList.toggle('zoom');this.setAttribute('aria-pressed',String(active));this.textContent=active?'Ekrana sığdır':'Büyüt';});</script>{% if remaining is not none %}<script>
const expires = performance.now() + {{ remaining|tojson }} * 1000;
function expireQuestions(){if(performance.now()>=expires){document.body.replaceChildren();const p=document.createElement('p');p.textContent='Çözüm süresi sona erdi. Sorular kapandı.';document.body.append(p);}}
setInterval(expireQuestions,1000);document.addEventListener('visibilitychange',expireQuestions);
</script>{% endif %}</body></html>
