{% if yaprak_gelisim and yaprak_gelisim.etiket %}
<section class="mt-3">
  <h3 class="font-black">Gelişim grafiği</h3>
  <p class="mt-1 text-sm text-slate-500">Yaprak testlerde netin nasıl değişti. Her çizgi bir ders.</p>
  <canvas id="yaprak-net" class="mt-3 max-h-64 w-full"></canvas>
</section>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
(function () {
  const tuval = document.getElementById("yaprak-net");
  if (!tuval) return;
  const veri = {{ yaprak_gelisim|tojson }};
  function ciz() {
    if (tuval.dataset.hazir) return;
    tuval.dataset.hazir = "1";
    requestAnimationFrame(function () {
      new Chart(tuval, {
        type: "line",
        data: {
          labels: veri.etiket,
          datasets: (veri.seriler || []).map(function (s) {
            return { label: s.ad, data: s.net, borderColor: s.renk, spanGaps: true, tension: 0.35, fill: false };
          })
        },
        options: { animation: { duration: 900 }, plugins: { legend: { position: "bottom" } }, scales: { y: { beginAtZero: true } } }
      });
    });
  }
  const detay = tuval.closest("details");
  if (!detay || detay.open) ciz();
  else detay.addEventListener("toggle", function () { if (detay.open) ciz(); });
})();
</script>
{% endif %}
