services:
  - type: web
    name: ogrenci-takip
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: OGR_TAKIP_DB_PATH
        value: /data/ogrenci_takip.db
      - key: OGR_TAKIP_DATA_DIR
        value: /data
    disk:
      name: veritabani
      mountPath: /data
      sizeGB: 1
