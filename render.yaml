services:
  - type: web
    name: ogrenci-takip
    runtime: python
    buildCommand: pip install -r requirements.txt && (bash scripts/libreoffice_kur.sh || echo "LibreOffice kurulamadi; PPTX tarayicida gosterilecek")
    startCommand: gunicorn web_app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: OGR_TAKIP_DB_PATH
        value: /var/data/ogrenci_takip.db
      - key: OGR_TAKIP_DATA_DIR
        value: /var/data
      - key: IKLIM_ANAHTAR
        value: LDsIng3TpqPBo7yMSc2bfY0t
      - key: ADMIN_SIFRE_HASH
        sync: false
      - key: YONETICI_PASSWORD_HASH
        sync: false
    disk:
      name: veritabani
      mountPath: /var/data
      sizeGB: 1
