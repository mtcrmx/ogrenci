services:
  - type: web
    name: ogrenci-takip
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn web_app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: OGR_TAKIP_DB_PATH
        value: /data/ogrenci_takip.db
      - key: OGR_TAKIP_DATA_DIR
        value: /data
    disk:
      name: veritabani
      mountPath: /data
      sizeGB: 1
